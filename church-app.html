<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>✝ شباب الكنيسة</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet"/>
<style>
:root {
  --gold:#C9A84C;--gold-light:#E8C97A;--gold-dark:#8B6914;
  --deep-blue:#0A1628;--navy:#0D2147;--blue:#1A3A6B;
  --cream:#F5ECD5;--cream-dark:#E8D5A8;--white:#FFFFFF;
  --text-dark:#0A1628;--text-mid:#3D5A8A;--text-light:#8FA5C9;
  --success:#27AE60;--warning:#F39C12;--danger:#E74C3C;
  --border:rgba(201,168,76,0.3);--shadow:0 4px 24px rgba(10,22,40,0.12);
  --radius:16px;--tr:all 0.3s cubic-bezier(0.4,0,0.2,1);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Cairo',sans-serif;background:var(--cream);color:var(--text-dark);direction:rtl;min-height:100vh;overflow-x:hidden}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:var(--cream-dark)}::-webkit-scrollbar-thumb{background:var(--gold-dark);border-radius:3px}

/* LOADER */
#initial-loader{position:fixed;inset:0;background:var(--deep-blue);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;gap:16px}
#initial-loader .cross{font-size:64px;color:var(--gold);animation:pulse 1.5s ease infinite}
#initial-loader p{color:var(--gold-light);font-family:'Amiri',serif;font-size:18px}
.loader{width:40px;height:40px;border:3px solid rgba(201,168,76,0.3);border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite}
.loader-wrap{display:flex;justify-content:center;padding:48px}

/* AUTH */
#auth-section{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--deep-blue),var(--navy));padding:20px;position:relative;overflow:hidden}
#auth-section::before{content:'✝';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:400px;color:rgba(201,168,76,0.03);pointer-events:none}
.auth-card{background:white;border-radius:24px;padding:36px;width:100%;max-width:460px;box-shadow:0 32px 80px rgba(0,0,0,0.4);animation:slideUp .4s ease}
.auth-logo{text-align:center;margin-bottom:28px}
.auth-cross{display:block;font-size:48px;color:var(--gold);margin-bottom:8px}
.auth-title{font-family:'Amiri',serif;font-size:26px;color:var(--deep-blue)}
.auth-tabs{display:grid;grid-template-columns:1fr 1fr;gap:0;background:var(--cream);border-radius:10px;padding:4px;margin-bottom:24px}
.auth-tab{padding:10px;border:none;background:none;cursor:pointer;font-family:'Cairo',sans-serif;font-size:14px;font-weight:700;border-radius:8px;color:var(--text-mid);transition:var(--tr)}
.auth-tab.active{background:white;color:var(--gold-dark);box-shadow:var(--shadow)}
.role-selector{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:4px}
.role-btn{padding:12px;border:2px solid var(--border);border-radius:10px;background:var(--cream);cursor:pointer;font-family:'Cairo',sans-serif;font-size:14px;font-weight:600;color:var(--text-mid);transition:var(--tr)}
.role-btn.active{border-color:var(--gold);background:rgba(201,168,76,0.1);color:var(--gold-dark)}
.team-selector{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.team-btn{padding:12px 10px;border:2px solid var(--border);border-radius:10px;background:var(--cream);cursor:pointer;font-family:'Cairo',sans-serif;font-weight:600;color:var(--text-mid);display:flex;flex-direction:column;align-items:center;gap:4px;transition:var(--tr)}
.team-btn.active{border-color:var(--tc,var(--gold));background:rgba(201,168,76,0.1);color:var(--gold-dark)}
.team-btn .ti{font-size:24px}.team-btn .tn{font-size:12px}
.auth-footer{text-align:center;margin-top:20px;color:var(--text-mid);font-size:14px}
.auth-link{color:var(--gold-dark);font-weight:700;cursor:pointer;text-decoration:underline}

/* APP */
#app{display:flex;min-height:100vh}
.sidebar{width:250px;min-height:100vh;background:linear-gradient(180deg,var(--deep-blue),var(--navy));display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto;border-left:1px solid rgba(201,168,76,0.2);flex-shrink:0;z-index:100;transition:transform .3s ease}
.sidebar-header{padding:20px 16px;border-bottom:1px solid rgba(201,168,76,0.2)}
.sidebar-logo{display:flex;align-items:center;gap:12px}
.logo-cross{font-size:30px;color:var(--gold)}
.logo-title{font-family:'Amiri',serif;font-size:18px;font-weight:700;color:var(--gold)}
.logo-sub{font-size:11px;color:var(--text-light)}
.sidebar-user{padding:16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid rgba(201,168,76,0.15)}
.user-avatar{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;border:2px solid rgba(201,168,76,0.4);flex-shrink:0;color:white}
.user-name{color:white;font-weight:700;font-size:14px}
.user-role{color:var(--gold-light);font-size:11px}
.sidebar-points{margin:12px 16px;background:rgba(201,168,76,0.1);border:1px solid rgba(201,168,76,0.3);border-radius:10px;padding:10px 14px;display:flex;align-items:center;gap:8px;color:var(--gold);font-weight:900;font-size:16px}
.sidebar-nav{flex:1;padding:8px;display:flex;flex-direction:column;gap:3px}
.nav-item{display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:10px;cursor:pointer;color:var(--text-light);font-weight:600;font-size:14px;transition:var(--tr);border:none;background:none;font-family:'Cairo',sans-serif;width:100%;text-align:right}
.nav-item:hover{background:rgba(201,168,76,0.1);color:var(--gold-light);transform:translateX(-3px)}
.nav-item.active{background:rgba(201,168,76,0.2);color:var(--gold);border:1px solid rgba(201,168,76,0.3)}
.nav-icon{font-size:18px}
.logout-btn{margin:12px 8px;display:flex;align-items:center;gap:8px;padding:11px 14px;background:rgba(231,76,60,0.1);border:1px solid rgba(231,76,60,0.3);border-radius:10px;color:#FC6C5C;font-family:'Cairo',sans-serif;font-size:14px;font-weight:600;cursor:pointer;width:calc(100% - 16px);transition:var(--tr)}
.logout-btn:hover{background:rgba(231,76,60,0.2)}
.main-content{flex:1;min-height:100vh;display:flex;flex-direction:column}
.mobile-header{display:none;align-items:center;justify-content:space-between;padding:12px 16px;background:var(--deep-blue);border-bottom:1px solid rgba(201,168,76,0.2);position:sticky;top:0;z-index:50}
.hamburger{background:none;border:none;color:var(--gold);font-size:22px;cursor:pointer}
.mobile-title{font-family:'Amiri',serif;color:var(--gold);font-size:18px;font-weight:700}
.content-wrapper{flex:1;padding:24px;max-width:1100px;width:100%;margin:0 auto}
.sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:99}

/* COMMON */
.card{background:white;border-radius:var(--radius);padding:22px;box-shadow:var(--shadow);border:1px solid var(--border);margin-bottom:16px}
.btn{display:inline-flex;align-items:center;gap:7px;padding:11px 22px;border-radius:10px;font-family:'Cairo',sans-serif;font-weight:600;font-size:14px;cursor:pointer;border:none;transition:var(--tr);text-decoration:none;white-space:nowrap}
.btn-primary{background:linear-gradient(135deg,var(--gold),var(--gold-dark));color:var(--deep-blue)}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(201,168,76,0.4)}
.btn-secondary{background:var(--navy);color:var(--gold);border:1px solid var(--border)}
.btn-outline{background:transparent;border:2px solid var(--gold);color:var(--gold-dark)}
.btn-outline:hover{background:var(--gold);color:var(--deep-blue)}
.btn-danger{background:var(--danger);color:white}
.btn-sm{padding:7px 14px;font-size:12px}
.btn:disabled{opacity:0.5;cursor:not-allowed;transform:none!important}
.form-group{margin-bottom:16px}
.form-label{display:block;font-weight:600;margin-bottom:6px;color:var(--text-dark);font-size:13px}
.form-input,.form-select,.form-textarea{width:100%;padding:11px 14px;border:2px solid var(--border);border-radius:10px;font-family:'Cairo',sans-serif;font-size:14px;color:var(--text-dark);background:var(--cream);transition:var(--tr);direction:rtl}
.form-input:focus,.form-select:focus,.form-textarea:focus{outline:none;border-color:var(--gold);background:white;box-shadow:0 0 0 3px rgba(201,168,76,0.15)}
.form-textarea{resize:vertical;min-height:90px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.badge{display:inline-flex;align-items:center;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700}
.badge-success{background:rgba(39,174,96,0.1);color:#1E8449;border:1px solid rgba(39,174,96,0.3)}
.badge-danger{background:rgba(231,76,60,0.1);color:var(--danger);border:1px solid rgba(231,76,60,0.3)}
.badge-warning{background:rgba(243,156,18,0.1);color:var(--warning);border:1px solid rgba(243,156,18,0.3)}
.badge-blue{background:rgba(26,58,107,0.1);color:var(--blue);border:1px solid rgba(26,58,107,0.3)}
.alert{padding:12px 16px;border-radius:10px;font-size:13px;font-weight:500;margin-bottom:12px}
.alert-success{background:rgba(39,174,96,0.1);color:#1E8449;border:1px solid rgba(39,174,96,0.4)}
.alert-error{background:rgba(231,76,60,0.1);color:#C0392B;border:1px solid rgba(231,76,60,0.4)}
.alert-warning{background:rgba(243,156,18,0.1);color:#B7770D;border:1px solid rgba(243,156,18,0.4)}
.alert-info{background:rgba(26,58,107,0.1);color:var(--blue);border:1px solid var(--border)}
.modal-overlay{position:fixed;inset:0;background:rgba(10,22,40,0.7);display:flex;align-items:center;justify-content:center;z-index:1000;padding:16px;backdrop-filter:blur(4px)}
.modal{background:white;border-radius:var(--radius);padding:28px;width:100%;max-width:500px;max-height:90vh;overflow-y:auto;box-shadow:0 24px 60px rgba(0,0,0,0.3);animation:slideUp .3s ease}
.modal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;padding-bottom:14px;border-bottom:2px solid var(--border)}
.modal-title{font-family:'Amiri',serif;font-size:20px;font-weight:700;color:var(--deep-blue)}
.modal-close{background:none;border:none;font-size:18px;cursor:pointer;color:var(--text-light)}
.page-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;flex-wrap:wrap;gap:10px}
.page-title{font-family:'Amiri',serif;font-size:26px;font-weight:700;color:var(--deep-blue)}
.section-title{font-family:'Amiri',serif;font-size:18px;color:var(--deep-blue);margin-bottom:14px;font-weight:700}
.empty{text-align:center;padding:36px;color:var(--text-light);background:white;border-radius:var(--radius);border:2px dashed var(--border)}
.empty span{font-size:44px;display:block;margin-bottom:10px}
.list-item{display:flex;align-items:center;gap:12px;padding:13px;background:var(--cream);border-radius:12px;border:1px solid var(--border);margin-bottom:8px}
.list-icon{font-size:22px;flex-shrink:0}
.list-info{flex:1}
.list-title{font-weight:600;color:var(--text-dark);font-size:14px}
.list-sub{font-size:12px;color:var(--text-light);margin-top:2px}
.text-muted{color:var(--text-light);font-size:13px}
.mt{margin-top:16px}
.mb{margin-bottom:12px}
.w-full{width:100%}
.mb0{margin-bottom:0}

/* DASHBOARD */
.welcome-hero{background:linear-gradient(135deg,var(--deep-blue),var(--blue));border-radius:20px;padding:26px;display:flex;align-items:center;justify-content:space-between;gap:14px;border:1px solid rgba(201,168,76,0.3);margin-bottom:24px;position:relative;overflow:hidden}
.welcome-hero::before{content:'✝';position:absolute;right:-20px;top:-20px;font-size:130px;color:rgba(255,255,255,0.04);line-height:1;pointer-events:none}
.welcome-left{display:flex;align-items:center;gap:14px}
.hero-cross{font-size:36px;color:var(--gold)}
.welcome-title{font-family:'Amiri',serif;font-size:22px;color:white;margin-bottom:4px}
.welcome-sub{color:var(--gold-light);font-size:13px}
.welcome-stats{display:flex;gap:10px;flex-shrink:0}
.stat-pill{background:rgba(255,255,255,0.08);border:1px solid rgba(201,168,76,0.3);border-radius:12px;padding:12px 16px;display:flex;align-items:center;gap:8px}
.stat-pill>span{font-size:22px}
.stat-num{font-size:20px;font-weight:900;color:var(--gold);line-height:1}
.stat-lbl{font-size:10px;color:rgba(255,255,255,0.5)}
.teams-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:8px}
.team-card{background:white;border-radius:14px;padding:18px 14px;text-align:center;border:2px solid var(--border);transition:var(--tr);position:relative;box-shadow:var(--shadow)}
.team-card:hover{transform:translateY(-4px);border-color:var(--tc,var(--gold))}
.my-team{border-color:var(--tc,var(--gold))!important;background:rgba(201,168,76,0.03)}
.team-rank{font-size:11px;font-weight:700;color:var(--text-light);margin-bottom:6px}
.team-emoji{font-size:32px;margin-bottom:6px}
.team-card-name{font-weight:700;color:var(--text-dark);font-size:13px;margin-bottom:5px}
.team-card-pts{font-size:15px;font-weight:900;color:var(--tc,var(--gold-dark))}
.crown{position:absolute;top:-10px;left:50%;transform:translateX(-50%);font-size:22px}

/* ATTENDANCE */
.active-meeting-card{background:linear-gradient(135deg,#fff9ed,#fff);border:2px solid var(--gold)}
.active-badge{display:inline-block;background:rgba(231,76,60,0.1);color:var(--danger);border:1px solid rgba(231,76,60,0.3);border-radius:20px;padding:3px 10px;font-size:11px;font-weight:700;margin-bottom:10px;animation:blink 1.5s ease infinite}
.meeting-title{font-family:'Amiri',serif;font-size:22px;color:var(--deep-blue);margin-bottom:5px}
.meeting-date{color:var(--text-mid);font-size:13px;margin-bottom:20px}
.servant-actions{display:grid;grid-template-columns:auto 1fr;gap:24px;align-items:start}
.qr-display{text-align:center}
.qr-label{font-weight:700;font-size:13px;color:var(--text-mid);margin-bottom:10px}
.qr-wrapper{background:var(--cream);border:3px solid var(--gold);border-radius:14px;padding:16px;display:inline-block}
.qr-hint{font-size:11px;color:var(--text-light);margin-top:8px}
.scan-btn{font-size:15px;padding:14px 28px;width:100%;justify-content:center}
.scan-result{padding:20px;border-radius:14px;text-align:center;font-size:16px;font-weight:700;margin-top:14px}
.scan-result.success{background:rgba(39,174,96,0.1);border:2px solid rgba(39,174,96,0.4);color:#1E8449}
.scan-result.warning{background:rgba(243,156,18,0.1);border:2px solid rgba(243,156,18,0.4);color:#B7770D}
.scan-result.error{background:rgba(231,76,60,0.1);border:2px solid rgba(231,76,60,0.4);color:#C0392B}
.attendees-wrap{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.attendee-chip{display:flex;align-items:center;gap:5px;background:var(--cream);border:1px solid var(--border);border-radius:20px;padding:5px 12px;font-size:12px;font-weight:600}

/* HOMEWORK */
.hw-card{background:white;border-radius:14px;padding:16px;border:2px solid var(--border);transition:var(--tr);display:flex;align-items:flex-start;gap:12px;box-shadow:var(--shadow);margin-bottom:12px}
.hw-card:hover{border-color:var(--gold);transform:translateX(-3px)}
.hw-icon{font-size:28px;flex-shrink:0}
.hw-body{flex:1}
.hw-title{font-weight:700;color:var(--text-dark);font-size:15px;margin-bottom:3px}
.hw-desc{font-size:12px;color:var(--text-mid);margin-bottom:3px}
.hw-due{font-size:11px;color:var(--danger);font-weight:600}
.hw-by{font-size:11px;color:var(--text-light);margin-top:3px}
.submission-item{background:var(--cream);border-radius:12px;padding:14px;border:1px solid var(--border);margin-bottom:10px}
.sub-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:8px}
.sub-name{font-weight:700;color:var(--text-dark);font-size:14px}
.sub-file{display:inline-block;color:var(--blue);font-size:13px;font-weight:600;text-decoration:none;margin-bottom:6px}
.sub-grade{font-size:13px;color:var(--text-dark);margin-top:6px}
.sub-feedback{font-size:12px;color:var(--text-mid);margin-top:3px;font-style:italic}
.file-upload-area{border:2px dashed var(--border);border-radius:12px;padding:28px;text-align:center;cursor:pointer;background:var(--cream)}
.file-upload-area:hover{border-color:var(--gold)}
.file-upload-area .fu-icon{font-size:36px;display:block;margin-bottom:6px}
.file-upload-area p{color:var(--text-mid);font-size:14px;font-weight:600}
.file-upload-area small{color:var(--text-light);font-size:11px}

/* COMPETITIONS */
.comp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.comp-card{background:white;border-radius:16px;padding:20px;border:2px solid var(--border);box-shadow:var(--shadow);transition:var(--tr)}
.comp-card:hover{transform:translateY(-4px)}
.comp-active{border-color:var(--gold);background:linear-gradient(135deg,#fffdf5,white)}
.comp-card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.comp-icon{font-size:30px}
.comp-title{font-family:'Amiri',serif;font-size:18px;font-weight:700;color:var(--deep-blue);margin-bottom:6px}
.comp-desc{color:var(--text-mid);font-size:13px;margin-bottom:12px}
.comp-meta{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.comp-meta span{font-size:11px;color:var(--text-light);background:var(--cream);padding:3px 8px;border-radius:16px;border:1px solid var(--border)}
.comp-actions{display:flex;gap:8px;flex-wrap:wrap}
.quiz-wrap{max-width:640px;margin:0 auto}
.quiz-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;background:var(--deep-blue);padding:16px 20px;border-radius:14px}
.quiz-title{color:var(--gold);font-family:'Amiri',serif;font-size:18px;font-weight:700}
.quiz-timer{color:white;font-size:20px;font-weight:900;background:rgba(255,255,255,0.1);padding:6px 14px;border-radius:8px}
.timer-danger{color:var(--danger)!important;animation:blink .5s ease infinite}
.quiz-progress-bar{height:5px;background:rgba(0,0,0,0.08);border-radius:3px;margin-bottom:10px}
.quiz-progress-fill{height:100%;background:var(--gold);border-radius:3px;transition:width .3s ease}
.quiz-counter{color:var(--text-light);font-size:13px;margin-bottom:20px;text-align:center}
.quiz-question-card{background:white;border-radius:18px;padding:28px;box-shadow:var(--shadow);border:1px solid var(--border)}
.quiz-q-text{font-size:18px;font-weight:700;color:var(--deep-blue);margin-bottom:22px;text-align:center;line-height:1.5}
.quiz-options{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.quiz-option{display:flex;align-items:center;gap:10px;padding:14px;border:2px solid var(--border);border-radius:12px;background:var(--cream);cursor:pointer;font-family:'Cairo',sans-serif;font-size:14px;font-weight:600;color:var(--text-dark);transition:var(--tr);text-align:right;width:100%}
.quiz-option:hover{border-color:var(--gold)}
.option-selected{border-color:var(--gold)!important;background:rgba(201,168,76,0.12)!important;color:var(--gold-dark)!important}
.option-letter{width:30px;height:30px;border-radius:50%;background:var(--deep-blue);color:var(--gold);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:13px;flex-shrink:0}
.option-selected .option-letter{background:var(--gold);color:var(--deep-blue)}
.quiz-footer{display:flex;justify-content:space-between;align-items:center;margin-top:20px}
.result-card{background:white;border-radius:24px;padding:44px;text-align:center;max-width:380px;width:100%;margin:32px auto;box-shadow:var(--shadow);border:2px solid var(--gold)}
.result-emoji{font-size:64px;margin-bottom:14px}
.result-title{font-family:'Amiri',serif;font-size:26px;color:var(--deep-blue);margin-bottom:14px}
.result-score{font-size:44px;font-weight:900;color:var(--gold-dark)}
.result-pct{font-size:18px;color:var(--text-mid);margin-bottom:10px}
.result-row{display:flex;align-items:center;gap:12px;padding:12px;background:var(--cream);border-radius:12px;border:1px solid var(--border);margin-bottom:8px}
.rank-num{font-size:15px;font-weight:900;color:var(--gold-dark);width:28px;text-align:center}
.rank-info{flex:1}
.rank-name{font-weight:700;color:var(--text-dark);font-size:14px}
.rank-team{font-size:11px;color:var(--text-light)}
.rank-score{font-size:15px;font-weight:900;color:var(--gold-dark)}
.question-block{background:var(--cream);border-radius:12px;padding:14px;margin-bottom:12px;border:1px solid var(--border)}
.q-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.q-num{font-weight:700;color:var(--gold-dark)}
.options-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.option-input-row{display:flex;align-items:center;gap:7px}
.correct-btn{background:none;border:none;font-size:16px;cursor:pointer;flex-shrink:0;padding:3px}

/* TEAMS */
.leader-banner{background:linear-gradient(135deg,var(--deep-blue),var(--navy));border:2px solid var(--tc,var(--gold));border-radius:18px;padding:24px 28px;display:flex;align-items:center;gap:16px;margin-bottom:20px}
.leader-crown{font-size:44px;flex-shrink:0}
.leader-name{font-family:'Amiri',serif;font-size:24px;font-weight:700;color:var(--tc,var(--gold))}
.teams-podium{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px}
.podium-card{background:white;border-radius:16px;padding:18px 14px;text-align:center;border:2px solid var(--border);cursor:pointer;transition:var(--tr);box-shadow:var(--shadow)}
.podium-card:hover{border-color:var(--tc,var(--gold));transform:translateY(-5px)}
.podium-rank{font-size:20px;margin-bottom:8px}
.podium-icon{font-size:40px;margin-bottom:8px}
.podium-name{font-weight:700;color:var(--text-dark);font-size:14px;margin-bottom:8px}
.podium-points{font-size:28px;font-weight:900;color:var(--tc,var(--gold-dark));line-height:1}
.podium-label{font-size:11px;color:var(--text-light);margin-bottom:10px}
.podium-bar-bg{height:5px;background:rgba(0,0,0,0.06);border-radius:3px;margin-bottom:8px}
.podium-bar-fill{height:100%;background:var(--tc,var(--gold));border-radius:3px;transition:width 1s ease}
.members-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.member-card{background:white;border-radius:14px;padding:18px 14px;text-align:center;border:1px solid var(--border);box-shadow:var(--shadow);transition:var(--tr);position:relative}
.member-card:hover{transform:translateY(-3px);border-color:var(--tc,var(--gold))}
.member-rank{position:absolute;top:8px;right:10px;font-size:10px;font-weight:700;color:var(--text-light)}
.member-avatar{width:48px;height:48px;border-radius:50%;margin:0 auto 8px;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;color:white}
.member-name{font-weight:700;color:var(--text-dark);font-size:13px;margin-bottom:5px}
.member-points{font-size:13px;font-weight:900;color:var(--tc,var(--gold-dark))}

/* SERVANT */
.servant-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px}
.servant-stat-card{background:white;border-radius:14px;padding:20px;text-align:center;border:2px solid var(--border);box-shadow:var(--shadow);border-top:4px solid var(--sc,var(--gold))}
.ss-icon{font-size:32px;margin-bottom:8px}
.ss-value{font-size:32px;font-weight:900;color:var(--sc,var(--gold-dark));line-height:1;margin-bottom:5px}
.ss-label{font-size:12px;color:var(--text-mid);font-weight:600}

@keyframes spin{to{transform:rotate(360deg)}}
@keyframes slideUp{from{transform:translateY(25px);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.5}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}

@media(max-width:768px){
  .sidebar{position:fixed;top:0;right:0;transform:translateX(100%);height:100%;z-index:100}
  .sidebar.open{transform:translateX(0)}
  .sidebar-overlay{display:block}
  .mobile-header{display:flex}
  .content-wrapper{padding:14px}
  .teams-row,.teams-podium{grid-template-columns:repeat(2,1fr)}
  .servant-actions{grid-template-columns:1fr}
  .quiz-options,.options-grid{grid-template-columns:1fr}
  .servant-stats{grid-template-columns:repeat(2,1fr)}
  .welcome-hero{flex-direction:column;align-items:flex-start}
  .welcome-stats{width:100%}
  .stat-pill{flex:1;justify-content:center}
  .form-row{grid-template-columns:1fr}
}
</style>
</head>
<body>

<!-- INITIAL LOADER -->
<div id="initial-loader">
  <div class="cross">✝</div>
  <div class="loader"></div>
  <p>شباب الكنيسة</p>
</div>

<!-- AUTH -->
<div id="auth-section" style="display:none">
  <div class="auth-card">
    <div class="auth-logo">
      <span class="auth-cross">✝</span>
      <h1 class="auth-title">شباب الكنيسة</h1>
    </div>
    <div class="auth-tabs">
      <button class="auth-tab active" onclick="showAuthTab('login')">تسجيل الدخول</button>
      <button class="auth-tab" onclick="showAuthTab('register')">حساب جديد</button>
    </div>
    <div id="login-form">
      <div id="login-msg"></div>
      <div class="form-group"><label class="form-label">📧 البريد الإلكتروني</label><input type="email" class="form-input" id="login-email" placeholder="example@church.com"/></div>
      <div class="form-group"><label class="form-label">🔒 كلمة المرور</label><input type="password" class="form-input" id="login-pass" placeholder="••••••••"/></div>
      <button class="btn btn-primary w-full" onclick="doLogin()">🚪 دخول</button>
      <div class="auth-footer">ليس لديك حساب؟ <span class="auth-link" onclick="showAuthTab('register')">سجّل الآن</span></div>
    </div>
    <div id="register-form" style="display:none">
      <div id="reg-msg"></div>
      <div class="form-group"><label class="form-label">👤 الاسم الكامل *</label><input class="form-input" id="reg-name" placeholder="اسمك الكامل"/></div>
      <div class="form-group"><label class="form-label">📧 البريد الإلكتروني *</label><input type="email" class="form-input" id="reg-email" placeholder="example@church.com"/></div>
      <div class="form-group"><label class="form-label">📱 رقم الهاتف</label><input class="form-input" id="reg-phone" placeholder="01xxxxxxxxx"/></div>
      <div class="form-group"><label class="form-label">🔒 كلمة المرور *</label><input type="password" class="form-input" id="reg-pass" placeholder="6 أحرف على الأقل"/></div>
      <div class="form-group">
        <label class="form-label">🎭 أنا...</label>
        <div class="role-selector">
          <button class="role-btn active" data-role="youth" onclick="selectRole(this)">🙋 شاب / فتاة</button>
          <button class="role-btn" data-role="servant" onclick="selectRole(this)">⭐ خادم / خادمة</button>
        </div>
      </div>
      <div id="team-section" class="form-group">
        <label class="form-label">⚔️ اختر فريقك</label>
        <div class="team-selector">
          <button class="team-btn" data-team="team_eagle" style="--tc:#E74C3C" onclick="selectTeam(this)"><span class="ti">🦅</span><span class="tn">فريق النسر</span></button>
          <button class="team-btn" data-team="team_lion" style="--tc:#F39C12" onclick="selectTeam(this)"><span class="ti">🦁</span><span class="tn">فريق الأسد</span></button>
          <button class="team-btn" data-team="team_bull" style="--tc:#27AE60" onclick="selectTeam(this)"><span class="ti">🐂</span><span class="tn">فريق الثور</span></button>
          <button class="team-btn" data-team="team_human" style="--tc:#2980B9" onclick="selectTeam(this)"><span class="ti">👤</span><span class="tn">فريق الإنسان</span></button>
        </div>
      </div>
      <button class="btn btn-primary w-full" onclick="doRegister()">✅ إنشاء الحساب</button>
      <div class="auth-footer">لديك حساب؟ <span class="auth-link" onclick="showAuthTab('login')">سجّل دخولك</span></div>
    </div>
  </div>
</div>

<!-- APP -->
<div id="app" style="display:none">
  <div class="sidebar-overlay" id="sidebar-overlay" onclick="toggleSidebar()"></div>
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-logo">
        <span class="logo-cross">✝</span>
        <div><div class="logo-title">شباب الكنيسة</div><div class="logo-sub">مرحباً بكم</div></div>
      </div>
    </div>
    <div class="sidebar-user">
      <div class="user-avatar" id="sb-avatar" style="background:#C9A84C">?</div>
      <div><div class="user-name" id="sb-name">...</div><div class="user-role" id="sb-role">...</div></div>
    </div>
    <div class="sidebar-points" id="sb-points">0 🌟</div>
    <nav class="sidebar-nav">
      <button class="nav-item active" data-page="dashboard" onclick="navigateTo('dashboard')"><span class="nav-icon">🏠</span> الرئيسية</button>
      <button class="nav-item" data-page="attendance" onclick="navigateTo('attendance')"><span class="nav-icon">✅</span> الحضور</button>
      <button class="nav-item" data-page="homework" onclick="navigateTo('homework')"><span class="nav-icon">📚</span> الواجبات</button>
      <button class="nav-item" data-page="competitions" onclick="navigateTo('competitions')"><span class="nav-icon">🏆</span> المسابقات</button>
      <button class="nav-item" data-page="teams" onclick="navigateTo('teams')"><span class="nav-icon">⚔️</span> الفرق</button>
      <button class="nav-item" data-page="servant" id="servant-nav" onclick="navigateTo('servant')" style="display:none"><span class="nav-icon">👑</span> لوحة الخدام</button>
    </nav>
    <button class="logout-btn" onclick="doLogout()"><span>🚪</span> تسجيل الخروج</button>
  </aside>
  <main class="main-content">
    <header class="mobile-header">
      <button class="hamburger" onclick="toggleSidebar()">☰</button>
      <span class="mobile-title">✝ شباب الكنيسة</span>
      <span id="sb-points-m" style="color:var(--gold-light);font-weight:700;font-size:13px">0 🌟</span>
    </header>
    <div class="content-wrapper">
      <div id="page-content"><div class="loader-wrap"><div class="loader"></div></div></div>
    </div>
  </main>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
import { getFirestore, collection, doc, getDoc, getDocs, setDoc, addDoc, updateDoc, query, where, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js";

// ── Firebase Config ───────────────────────────────────
const firebaseConfig = {
  apiKey: "AIzaSyBT43B29gAgH6ufXOkXQWy-RIj9yDQXkuE",
  authDomain: "attendance-church-1-e10c7.firebaseapp.com",
  projectId: "attendance-church-1-e10c7",
  storageBucket: "attendance-church-1-e10c7.firebasestorage.app",
  messagingSenderId: "773950808320",
  appId: "1:773950808320:web:1c6b066915563e20ddd3e5"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const storage = getStorage(app);

// ── Default Teams ─────────────────────────────────────
const DEFAULT_TEAMS = [
  {id:"team_eagle",name:"فريق النسر",color:"#E74C3C",icon:"🦅",total_points:0},
  {id:"team_lion",name:"فريق الأسد",color:"#F39C12",icon:"🦁",total_points:0},
  {id:"team_bull",name:"فريق الثور",color:"#27AE60",icon:"🐂",total_points:0},
  {id:"team_human",name:"فريق الإنسان",color:"#2980B9",icon:"👤",total_points:0},
];

async function bootstrapTeams() {
  for (const t of DEFAULT_TEAMS) {
    const s = await getDoc(doc(db,"teams",t.id));
    if (!s.exists()) await setDoc(doc(db,"teams",t.id), t);
  }
}

// ── State ─────────────────────────────────────────────
let CU = null; // currentUser
let activeMtg = null;
let quizState = null;
let questionsData = [];
let currentHWId = null;
let currentSubId = null;

// ── Auth ──────────────────────────────────────────────
onAuthStateChanged(auth, async (fbUser) => {
  if (fbUser) {
    await bootstrapTeams();
    const snap = await getDoc(doc(db,"users",fbUser.uid));
    if (!snap.exists()) { await signOut(auth); return; }
    CU = {id:snap.id,...snap.data()};
    if (CU.team_id) {
      const ts = await getDoc(doc(db,"teams",CU.team_id));
      if (ts.exists()) CU.teams = {id:ts.id,...ts.data()};
    }
    showApp();
    navigateTo('dashboard');
  } else {
    CU = null;
    document.getElementById('initial-loader').style.display='none';
    document.getElementById('app').style.display='none';
    document.getElementById('auth-section').style.display='flex';
  }
});

// ── Auth Actions ──────────────────────────────────────
window.doLogin = async function() {
  const email = document.getElementById('login-email').value;
  const pass = document.getElementById('login-pass').value;
  if (!email||!pass) { showMsg('login-msg','⚠️ أدخل البريد وكلمة المرور','warning'); return; }
  showMsg('login-msg','⏳ جاري الدخول...','info');
  try { await signInWithEmailAndPassword(auth, email, pass); }
  catch(e) { showMsg('login-msg','❌ بيانات غير صحيحة','error'); }
};

window.doRegister = async function() {
  const name = document.getElementById('reg-name').value;
  const email = document.getElementById('reg-email').value;
  const pass = document.getElementById('reg-pass').value;
  const phone = document.getElementById('reg-phone').value;
  const roleBtn = document.querySelector('.role-btn.active');
  const teamBtn = document.querySelector('.team-btn.active');
  const role = roleBtn?.dataset.role || 'youth';
  const teamId = teamBtn?.dataset.team || '';
  if (!name||!email||!pass) { showMsg('reg-msg','⚠️ أكمل الحقول المطلوبة','warning'); return; }
  showMsg('reg-msg','⏳ جاري التسجيل...','info');
  try {
    const cred = await createUserWithEmailAndPassword(auth, email, pass);
    await setDoc(doc(db,"users",cred.user.uid), {uid:cred.user.uid,name,phone,role,team_id:role==='youth'?teamId:'',total_points:0,created_at:serverTimestamp()});
  } catch(e) {
    showMsg('reg-msg', e.code==='auth/email-already-in-use'?'❌ الإيميل مستخدم':'❌ '+e.message, 'error');
  }
};

window.doLogout = async function() { await signOut(auth); };
window.selectRole = function(btn) {
  document.querySelectorAll('.role-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('team-section').style.display = btn.dataset.role==='youth'?'block':'none';
};
window.selectTeam = function(btn) {
  document.querySelectorAll('.team-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
};

// ── App Shell ─────────────────────────────────────────
function showApp() {
  document.getElementById('initial-loader').style.display='none';
  document.getElementById('auth-section').style.display='none';
  document.getElementById('app').style.display='flex';
  document.getElementById('sb-name').textContent = CU.name;
  document.getElementById('sb-role').textContent = CU.role==='servant'?'⭐ خادم':`فريق ${CU.teams?.name||'غير محدد'} ${CU.teams?.icon||''}`;
  document.getElementById('sb-points').textContent = `${CU.total_points||0} 🌟`;
  document.getElementById('sb-points-m').textContent = `${CU.total_points||0} 🌟`;
  document.getElementById('sb-avatar').textContent = CU.teams?.icon || CU.name?.[0] || '?';
  document.getElementById('sb-avatar').style.background = CU.teams?.color || '#C9A84C';
  document.getElementById('servant-nav').style.display = CU.role==='servant'?'flex':'none';
}

window.navigateTo = function(page) {
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
  const el = document.querySelector(`.nav-item[data-page="${page}"]`);
  if (el) el.classList.add('active');
  document.getElementById('sidebar').classList.remove('open');
  renderPage(page);
};

window.toggleSidebar = function() { document.getElementById('sidebar').classList.toggle('open'); };
window.showAuthTab = function(tab) {
  document.getElementById('login-form').style.display = tab==='login'?'block':'none';
  document.getElementById('register-form').style.display = tab==='register'?'block':'none';
  document.querySelectorAll('.auth-tab').forEach((t,i)=>t.classList.toggle('active',(i===0&&tab==='login')||(i===1&&tab==='register')));
};
window.closeModal = function(id) { document.getElementById(id).style.display='none'; };

function setContent(html) { document.getElementById('page-content').innerHTML = html; }
function showMsg(id,msg,type) {
  const el=document.getElementById(id); if(!el)return;
  el.innerHTML=`<div class="alert alert-${type==='success'?'success':type==='error'?'error':type==='warning'?'warning':'info'}">${msg}</div>`;
  if(type==='success') setTimeout(()=>{if(el)el.innerHTML='';},3000);
}
function fmt(s) { return `${Math.floor(s/60).toString().padStart(2,'0')}:${(s%60).toString().padStart(2,'0')}`; }

// ── DB Helpers ────────────────────────────────────────
async function getTeamsSorted() {
  const s = await getDocs(collection(db,'teams'));
  return s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>b.total_points-a.total_points);
}
async function addUserPts(uid,pts) { const r=doc(db,'users',uid);const s=await getDoc(r);if(s.exists())await updateDoc(r,{total_points:(s.data().total_points||0)+pts}); }
async function addTeamPts(tid,pts) { if(!tid)return;const r=doc(db,'teams',tid);const s=await getDoc(r);if(s.exists())await updateDoc(r,{total_points:(s.data().total_points||0)+pts}); }
async function getActiveMtg() { const s=await getDocs(query(collection(db,'meetings'),where('is_active','==',true)));return s.empty?null:{id:s.docs[0].id,...s.docs[0].data()}; }
async function recordAtt(userId,meetingId,servantId) {
  const id=`${userId}_${meetingId}`;
  const ex=await getDoc(doc(db,'attendance',id));
  if(ex.exists())return{already:true};
  const us=await getDoc(doc(db,'users',userId));
  const ud=us.exists()?us.data():{};
  await setDoc(doc(db,'attendance',id),{user_id:userId,meeting_id:meetingId,scanned_by:servantId||'',points_earned:10,scanned_at:serverTimestamp()});
  await addUserPts(userId,10);
  if(ud.team_id)await addTeamPts(ud.team_id,10);
  return{already:false};
}

// ══════════════════════════════════════════════════════
// PAGES
// ══════════════════════════════════════════════════════

async function renderPage(page) {
  setContent('<div class="loader-wrap"><div class="loader"></div></div>');
  try {
    switch(page) {
      case 'dashboard': await pgDashboard(); break;
      case 'attendance': await pgAttendance(); break;
      case 'homework': await pgHomework(); break;
      case 'competitions': await pgCompetitions(); break;
      case 'teams': await pgTeams(); break;
      case 'servant': await pgServant(); break;
    }
  } catch(e) {
    setContent(`<div class="card"><div class="alert alert-error">❌ حدث خطأ: ${e.message}</div></div>`);
  }
}

// ── DASHBOARD ─────────────────────────────────────────
async function pgDashboard() {
  const [teams, attSnap] = await Promise.all([
    getTeamsSorted(),
    getDocs(query(collection(db,'attendance'),where('user_id','==',CU.id)))
  ]);
  const att = attSnap.docs.map(d=>({id:d.id,...d.data()}));
  const myTeam = teams.find(t=>t.id===CU.team_id);

  const teamsHtml = teams.map((t,i)=>`
    <div class="team-card ${CU.team_id===t.id?'my-team':''}" style="--tc:${t.color}">
      ${i===0?'<div class="crown">👑</div>':''}
      <div class="team-rank">#${i+1}</div>
      <div class="team-emoji">${t.icon}</div>
      <div class="team-card-name">${t.name}</div>
      <div class="team-card-pts">${t.total_points} نقطة</div>
    </div>`).join('');

  const attHtml = att.length===0
    ? '<div class="empty"><span>📋</span><p>لم يتم تسجيل حضور بعد</p></div>'
    : att.slice(0,5).map(a=>`<div class="list-item"><span class="list-icon">✅</span><div class="list-info"><div class="list-title">اجتماع</div></div><div style="font-weight:700;color:var(--gold-dark)">+${a.points_earned} 🌟</div></div>`).join('');

  setContent(`
    <div class="welcome-hero">
      <div class="welcome-left">
        <span class="hero-cross">✝</span>
        <div>
          <h1 class="welcome-title">مرحباً، ${CU.name.split(' ')[0]} 👋</h1>
          <p class="welcome-sub">${CU.role==='servant'?'⭐ خادم مبارك في خدمتك':`فريق ${myTeam?.name||'غير محدد'} ${myTeam?.icon||''}`}</p>
        </div>
      </div>
      <div class="welcome-stats">
        <div class="stat-pill"><span>🌟</span><div><div class="stat-num">${CU.total_points||0}</div><div class="stat-lbl">نقاطي</div></div></div>
        <div class="stat-pill"><span>✅</span><div><div class="stat-num">${att.length}</div><div class="stat-lbl">حضور</div></div></div>
      </div>
    </div>
    <div class="card">
      <div class="section-title">⚔️ ترتيب الفرق</div>
      <div class="teams-row">${teamsHtml}</div>
    </div>
    <div class="card">
      <div class="section-title">📅 سجل حضوري</div>
      ${attHtml}
    </div>`);
}

// ── ATTENDANCE ────────────────────────────────────────
async function pgAttendance() {
  activeMtg = await getActiveMtg();
  const mtgSnap = await getDocs(query(collection(db,'meetings'),orderBy('created_at','desc')));
  const meetings = mtgSnap.docs.map(d=>({id:d.id,...d.data()}));

  let activeHtml = '';
  if (activeMtg) {
    if (CU.role==='servant') {
      const attSnap = await getDocs(query(collection(db,'attendance'),where('meeting_id','==',activeMtg.id)));
      const attList = attSnap.docs.map(d=>d.data());
      const enriched = await Promise.all(attList.map(async a=>{

window.showModal = function(id) { document.getElementById(id).style.display='flex'; };

window.manualRecord = async function() {
  const uid = document.getElementById('manual-user').value;
  if (!uid||!activeMtg) return;
  const result = await recordAtt(uid, activeMtg.id, CU.id);
  showMsg('manual-msg', result.already?'⚠️ سُجّل مسبقاً':'✅ تم التسجيل! +10 نقاط', result.already?'warning':'success');
  if (!result.already) setTimeout(()=>navigateTo('attendance'),1500);
};

window.doScan = async function() {
  if (!activeMtg) return;
  // Simple manual QR entry for mobile
  const code = prompt('أدخل كود QR:');
  if (!code) return;
  const snap = await getDocs(query(collection(db,'meetings'),where('qr_code','==',code),where('is_active','==',true)));
  if (snap.empty) { document.getElementById('scan-res').innerHTML='<div class="scan-result error">❌ كود غير صالح</div>'; return; }
  const mtg = {id:snap.docs[0].id,...snap.docs[0].data()};
  const result = await recordAtt(CU.id, mtg.id, null);
  document.getElementById('scan-res').innerHTML = `<div class="scan-result ${result.already?'warning':'success'}">${result.already?'⚠️ سُجّلت مسبقاً':'✅ تم تسجيل حضورك! +10 نقاط 🌟'}</div>`;
};

window.createMtg = async function() {
  const title = document.getElementById('mtg-title').value;
  if (!title) { showMsg('mtg-msg','⚠️ أدخل العنوان','warning'); return; }
  if (activeMtg) await updateDoc(doc(db,'meetings',activeMtg.id),{is_active:false});
  const qr = `mtg_${Date.now()}_${Math.random().toString(36).substr(2,8)}`;
  await addDoc(collection(db,'meetings'),{title,meeting_date:document.getElementById('mtg-date').value,meeting_time:document.getElementById('mtg-time').value,qr_code:qr,is_active:true,created_by:CU.id,created_at:serverTimestamp()});

window.createHW = async function() {

};

window.showSubmitHW = function(hwId, title) {
  currentHWId = hwId;
  document.getElementById('submit-hw-name').textContent = title;
  showModal('submit-hw-modal');
};

window.onFile = function(input) {
  if (input.files[0]) document.getElementById('file-lbl').textContent = input.files[0].name;
};

window.submitHW = async function() {
  const file = document.getElementById('hw-file-i').files[0];
  if (!file) { showMsg('submit-msg','⚠️ اختر ملف أولاً','warning'); return; }
  const btn = document.getElementById('submit-btn');
  btn.disabled=true; btn.textContent='⏳ جاري الرفع...';
  try {
    const path = `homework/${currentHWId}/${CU.id}/${Date.now()}_${file.name}`;
    const sr = ref(storage, path);
    await uploadBytes(sr, file);
    const url = await getDownloadURL(sr);
    await setDoc(doc(db,'homework_submissions',`${currentHWId}_${CU.id}`),{homework_id:currentHWId,user_id:CU.id,file_url:url,file_type:file.type,status:'pending',submitted_at:serverTimestamp()});
    closeModal('submit-hw-modal');
    showMsg('hw-msg','✅ تم تسليم الواجب بنجاح!','success');
  } catch(e) { showMsg('submit-msg','❌ خطأ: '+e.message,'error'); }
  btn.disabled=false; btn.textContent='📤 تسليم';
};

window.showSubs = async function(hwId, title) {
  const snap = await getDocs(query(collection(db,'homework_submissions'),where('homework_id','==',hwId)));
  const subs = snap.docs.map(d=>({id:d.id,...d.data()}));
  const enriched = await Promise.all(subs.map(async s=>{
    const us=await getDoc(doc(db,'users',s.user_id));
    if(us.exists())s.uname=us.data().name;
    return s;
  }));
  const STATUS={pending:'⏳ قيد المراجعة',approved:'✅ مقبول',needs_revision:'🔄 يحتاج مراجعة'};
  const html = enriched.map(s=>`
    <div class="submission-item">
      <div class="sub-header"><div class="sub-name">${s.uname||'مجهول'}</div><span class="badge ${s.status==='approved'?'badge-success':s.status==='needs_revision'?'badge-danger':'badge-warning'}">${STATUS[s.status]||s.status}</span></div>
      ${s.file_url?`<a href="${s.file_url}" target="_blank" class="sub-file">${s.file_type?.startsWith('image')?'🖼️ عرض الصورة':'📄 تحميل الملف'}</a>`:''}
      ${s.grade?`<div class="sub-grade">الدرجة: <strong>${s.grade}/100</strong>${s.servant_feedback?`<p class="sub-feedback">${s.servant_feedback}</p>`:''}</div>`:''}
      ${s.status==='pending'?`<button class="btn btn-secondary btn-sm mt" onclick="showReview('${s.id}','${(s.uname||'').replace(/'/g,"\\'")}','${s.file_url||''}')">✏️ تصحيح</button>`:''}
    </div>`).join('') || '<div class="empty"><span>📭</span><p>لا توجد تسليمات بعد</p></div>';
  const panel = document.getElementById('subs-panel');
  panel.innerHTML = `<div class="card mt"><div class="section-title">📬 تسليمات: ${title}</div>${html}</div>`;
  panel.scrollIntoView({behavior:'smooth'});
};

window.showReview = function(subId, name, url) {

window.submitReview = async function() {

window.showCreateComp = function() {
  questionsData=[{text:'',options:['','','',''],correct:0}];
  renderQs();
  showModal('create-comp-modal');
};
window.addQ = function() { questionsData.push({text:'',options:['','','',''],correct:0}); renderQs(); };
window.removeQ = function(i) { questionsData.splice(i,1); renderQs(); };
window.setCorrect = function(qi,oi) { questionsData[qi].correct=oi; renderQs(); };

function renderQs() {
  const c = document.getElementById('qs-container'); if(!c)return;
  c.innerHTML = questionsData.map((q,qi)=>`
    <div class="question-block">
      <div class="q-header"><span class="q-num">س${qi+1}</span>${questionsData.length>1?`<button type="button" class="btn btn-danger btn-sm" onclick="removeQ(${qi})">حذف</button>`:''}</div>
      <input class="form-input mb" placeholder="نص السؤال..." value="${q.text}" oninput="questionsData[${qi}].text=this.value"/>
      <div class="options-grid">${q.options.map((o,oi)=>`
        <div class="option-input-row">
          <button type="button" class="correct-btn" onclick="setCorrect(${qi},${oi})">${q.correct===oi?'✅':'⬜'}</button>
          <input class="form-input" placeholder="${['أ','ب','ج','د'][oi]}" value="${o}" oninput="questionsData[${qi}].options[${oi}]=this.value"/>
        </div>`).join('')}
      </div>
    </div>`).join('');
}

window.createComp = async function() {
  const title = document.getElementById('comp-title-i').value;
  if (!title||questionsData.some(q=>!q.text)) { alert('أكمل جميع الحقول'); return; }
  await addDoc(collection(db,'competitions'),{title,questions:questionsData.map(q=>({text:q.text,options:q.options,correct_answer:q.correct})),time_limit_minutes:parseInt(document.getElementById('comp-time-i').value)||30,points_per_question:parseInt(document.getElementById('comp-pts-i').value)||5,is_active:false,created_by:CU.id,created_at:serverTimestamp()});
  closeModal('create-comp-modal');
  navigateTo('competitions');
};

window.activateComp = async function(id) {
  await updateDoc(doc(db,'competitions',id),{is_active:true,start_time:serverTimestamp()});
  navigateTo('competitions');
};

window.startQuiz = async function(compId) {
  const s = await getDoc(doc(db,'competitions',compId));
  const comp={id:s.id,...s.data()};
  quizState={comp,answers:new Array(comp.questions.length).fill(null),current:0,startTime:Date.now(),timeLeft:comp.time_limit_minutes*60};
  document.getElementById('comp-list').style.display='none';
  document.querySelector('.page-header').style.display='none';
  renderQuiz();
  quizState.timer=setInterval(()=>{
    quizState.timeLeft--;
    if(quizState.timeLeft<=0){clearInterval(quizState.timer);submitQuiz();}
    else{const el=document.getElementById('qt');if(el){el.textContent='⏱️ '+fmt(quizState.timeLeft);if(quizState.timeLeft<60)el.classList.add('timer-danger');}}
  },1000);
};

function renderQuiz() {
  const {comp,answers,current,timeLeft}=quizState;
  const q=comp.questions[current];
  document.getElementById('quiz-area').innerHTML=`
    <div class="quiz-wrap">
      <div class="quiz-header"><div class="quiz-title">${comp.title}</div><div class="quiz-timer" id="qt">⏱️ ${fmt(timeLeft)}</div></div>
      <div class="quiz-progress-bar"><div class="quiz-progress-fill" style="width:${(current/comp.questions.length)*100}%"></div></div>
      <div class="quiz-counter">السؤال ${current+1} من ${comp.questions.length}</div>
      <div class="quiz-question-card">
        <div class="quiz-q-text">${q.text}</div>
        <div class="quiz-options">${q.options.map((o,i)=>`<button class="quiz-option ${answers[current]===i?'option-selected':''}" onclick="selAns(${i})"><span class="option-letter">${['أ','ب','ج','د'][i]}</span><span>${o}</span></button>`).join('')}</div>
      </div>
      <div class="quiz-footer">
        ${current>0?`<button class="btn btn-outline" onclick="qNav(-1)">◀ السابق</button>`:'<div></div>'}
        ${current<comp.questions.length-1?`<button class="btn btn-primary" onclick="qNav(1)" ${answers[current]===null?'disabled':''}>التالي ▶</button>`:`<button class="btn btn-primary" onclick="submitQuiz()">✅ إنهاء</button>`}
      </div>
    </div>`;
}

window.selAns=function(i){quizState.answers[quizState.current]=i;renderQuiz();};
window.qNav=function(d){quizState.current+=d;renderQuiz();};

window.submitQuiz = async function() {
  clearInterval(quizState.timer);
  const {comp,answers,startTime}=quizState;
  let score=0;
  answers.forEach((a,i)=>{if(comp.questions[i]&&a===comp.questions[i].correct_answer)score+=comp.points_per_question;});
  const total=comp.questions.length*comp.points_per_question;
  const pct=Math.round((score/total)*100);
  try {
    await setDoc(doc(db,'competition_answers',`${comp.id}_${CU.id}`),{competition_id:comp.id,user_id:CU.id,team_id:CU.team_id||'',answers,score,time_taken_seconds:Math.floor((Date.now()-startTime)/1000),submitted_at:serverTimestamp()});
    await addUserPts(CU.id,score);
    if(CU.team_id)await addTeamPts(CU.team_id,score);
  }catch(e){}
  document.getElementById('quiz-area').innerHTML=`
    <div class="result-card">
      <div class="result-emoji">${pct>=70?'🏆':pct>=50?'🌟':'📚'}</div>
      <h2 class="result-title">${pct>=70?'ممتاز!':pct>=50?'جيد جداً!':'حاول مرة أخرى'}</h2>
      <div class="result-score">${score} / ${total}</div>
      <div class="result-pct">${pct}%</div>
      <p style="color:var(--text-light);margin:12px 0">تم احتساب النقاط لفريقك 🎉</p>
      <button class="btn btn-primary mt" onclick="navigateTo('competitions')">العودة</button>
    </div>`;
};

window.showResults = async function(compId, title) {
  document.getElementById('results-title').textContent='📊 '+title;
  document.getElementById('results-body').innerHTML='<div class="loader-wrap"><div class="loader"></div></div>';
  showModal('results-modal');
  const snap=await getDocs(query(collection(db,'competition_answers'),where('competition_id','==',compId)));
  const list=snap.docs.map(d=>({id:d.id,...d.data()}));
  const enriched=await Promise.all(list.map(async r=>{
    const us=await getDoc(doc(db,'users',r.user_id));if(us.exists())r.uname=us.data().name;
    if(r.team_id){const ts=await getDoc(doc(db,'teams',r.team_id));if(ts.exists())r.team=ts.data();}
    return r;
  }));
  enriched.sort((a,b)=>b.score-a.score);
  document.getElementById('results-body').innerHTML=enriched.length===0
    ?'<div class="empty"><span>📭</span><p>لا توجد نتائج</p></div>'
    :enriched.map((r,i)=>`<div class="result-row"><span class="rank-num">#${i+1}</span><span>${r.team?.icon||'👤'}</span><div class="rank-info"><div class="rank-name">${r.uname||'مجهول'}</div><div class="rank-team">${r.team?.name||''}</div></div><div class="rank-score">${r.score} 🌟</div></div>`).join('');
};

// ── TEAMS ─────────────────────────────────────────────
async function pgTeams() {
  const [teams, usersSnap] = await Promise.all([getTeamsSorted(), getDocs(collection(db,'users'))]);
  const users = usersSnap.docs.map(d=>({id:d.id,...d.data()}));
  const maxPts = Math.max(...teams.map(t=>t.total_points),1);
  const leader = teams[0];

  const podium = teams.map((t,i)=>`
    <div class="podium-card" style="--tc:${t.color}" onclick="showMembers('${t.id}')">
      <div class="podium-rank">${i===0?'🥇':i===1?'🥈':i===2?'🥉':'#'+(i+1)}</div>
      <div class="podium-icon">${t.icon}</div>
      <div class="podium-name">${t.name}</div>
      <div class="podium-points">${t.total_points}</div>
      <div class="podium-label">نقطة</div>
      <div class="podium-bar-bg"><div class="podium-bar-fill" style="width:${(t.total_points/maxPts)*100}%"></div></div>
      <div style="font-size:12px;color:var(--text-light)">${users.filter(u=>u.team_id===t.id&&u.role==='youth').length} عضو</div>
    </div>`).join('');

  setContent(`
    <div class="page-header"><h1 class="page-title">⚔️ الفرق</h1></div>
    ${leader?`<div class="leader-banner" style="--tc:${leader.color}"><div class="leader-crown">👑</div><div><div style="font-size:11px;color:rgba(255,255,255,0.5);letter-spacing:2px">الفريق الأول</div><div class="leader-name">${leader.icon} ${leader.name}</div><div style="color:rgba(255,255,255,0.8);font-weight:700">${leader.total_points} نقطة</div></div></div>`:''}
    <div class="teams-podium">${podium}</div>
    <div id="members-panel"></div>`);
}

window.showMembers = async function(teamId) {
  const [teams, usersSnap] = await Promise.all([getTeamsSorted(), getDocs(collection(db,'users'))]);
  const team = teams.find(t=>t.id===teamId);
  const members = usersSnap.docs.map(d=>({id:d.id,...d.data()})).filter(u=>u.team_id===teamId&&u.role==='youth').sort((a,b)=>(b.total_points||0)-(a.total_points||0));
  const panel = document.getElementById('members-panel');
  panel.innerHTML=`<div class="card"><div class="section-title" style="color:${team?.color}">${team?.icon} أعضاء ${team?.name}</div>${
    members.length===0?'<div class="empty"><span>👥</span><p>لا يوجد أعضاء بعد</p></div>'
    :`<div class="members-grid">${members.map((m,i)=>`<div class="member-card" style="--tc:${team?.color}"><div class="member-rank">#${i+1}</div><div class="member-avatar" style="background:${team?.color}">${m.name?.[0]}</div><div class="member-name">${m.name}</div><div class="member-points">${m.total_points||0} 🌟</div></div>`).join('')}</div>`
  }</div>`;
  panel.scrollIntoView({behavior:'smooth'});
};

// ── SERVANT DASHBOARD ─────────────────────────────────
async function pgServant() {
  const [usersSnap, mtgSnap, hwSnap, compSnap] = await Promise.all([
    getDocs(collection(db,'users')),
    getDocs(collection(db,'meetings')),
    getDocs(collection(db,'homework')),
    getDocs(collection(db,'competitions'))
  ]);
  const youth = usersSnap.docs.filter(d=>d.data().role==='youth');
  const stats=[
    {icon:'👥',label:'شباب مسجلين',value:youth.length,color:'#2980B9'},
    {icon:'📅',label:'اجتماعات',value:mtgSnap.size,color:'#27AE60'},
    {icon:'📚',label:'واجبات',value:hwSnap.size,color:'#F39C12'},
    {icon:'🏆',label:'مسابقات',value:compSnap.size,color:'#E74C3C'},
  ];
  const membersHtml = youth.map(d=>{const u=d.data();return`<div class="member-card"><div class="member-avatar" style="background:#C9A84C">${u.name?.[0]}</div><div class="member-name">${u.name}</div><div class="member-points">${u.total_points||0} 🌟</div></div>`;}).join('') || '<div class="empty"><span>👥</span><p>لا يوجد شباب مسجلين بعد</p></div>';

  setContent(`
    <div class="page-header"><h1 class="page-title">👑 لوحة الخدام</h1></div>
    <div class="servant-stats">${stats.map(s=>`<div class="servant-stat-card" style="--sc:${s.color}"><div class="ss-icon">${s.icon}</div><div class="ss-value">${s.value}</div><div class="ss-label">${s.label}</div></div>`).join('')}</div>
    <div class="card"><div class="section-title">👥 كل الشباب</div><div class="members-grid">${membersHtml}</div></div>`);
}
</script>
