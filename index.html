<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>✝ شباب الكنيسة</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet"/>
<style>
:root{--gold:#C9A84C;--gold-light:#E8C97A;--gold-dark:#8B6914;--deep-blue:#0A1628;--navy:#0D2147;--blue:#1A3A6B;--cream:#F5ECD5;--cream-dark:#E8D5A8;--text-dark:#0A1628;--text-mid:#3D5A8A;--text-light:#8FA5C9;--danger:#E74C3C;--warning:#F39C12;--border:rgba(201,168,76,0.3);--shadow:0 4px 24px rgba(10,22,40,0.12);--radius:16px;--tr:all 0.3s ease}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Cairo',sans-serif;background:var(--cream);color:var(--text-dark);direction:rtl;min-height:100vh;overflow-x:hidden}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-thumb{background:var(--gold-dark);border-radius:3px}

/* LOADER */
#splash{position:fixed;inset:0;background:var(--deep-blue);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;gap:20px;transition:opacity .5s ease}
#splash .sp-cross{font-size:72px;color:var(--gold);animation:pulse 1.5s ease infinite}
#splash p{color:var(--gold-light);font-family:'Amiri',serif;font-size:20px}
.spin{width:44px;height:44px;border:3px solid rgba(201,168,76,0.3);border-top-color:var(--gold);border-radius:50%;animation:spin .7s linear infinite}
.loader-wrap{display:flex;justify-content:center;padding:48px}
.loader-sm{width:28px;height:28px;border:2px solid rgba(201,168,76,0.3);border-top-color:var(--gold);border-radius:50%;animation:spin .7s linear infinite;display:inline-block}

/* AUTH */
#auth{min-height:100vh;display:none;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--deep-blue),var(--navy));padding:20px;position:relative;overflow:hidden}
#auth::before{content:'✝';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:400px;color:rgba(201,168,76,0.03);pointer-events:none}
.auth-card{background:white;border-radius:24px;padding:36px;width:100%;max-width:460px;box-shadow:0 32px 80px rgba(0,0,0,0.4);animation:slideUp .4s ease}
.auth-logo{text-align:center;margin-bottom:24px}
.auth-cross{display:block;font-size:48px;color:var(--gold);margin-bottom:8px}
.auth-title{font-family:'Amiri',serif;font-size:26px;color:var(--deep-blue)}
.auth-tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--cream);border-radius:10px;padding:4px;margin-bottom:24px}
.auth-tab{padding:10px;border:none;background:none;cursor:pointer;font-family:'Cairo',sans-serif;font-size:14px;font-weight:700;border-radius:8px;color:var(--text-mid);transition:var(--tr)}
.auth-tab.active{background:white;color:var(--gold-dark);box-shadow:0 2px 8px rgba(0,0,0,0.1)}
.role-sel{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.role-btn{padding:12px;border:2px solid var(--border);border-radius:10px;background:var(--cream);cursor:pointer;font-family:'Cairo',sans-serif;font-size:14px;font-weight:600;color:var(--text-mid);transition:var(--tr)}
.role-btn.active{border-color:var(--gold);background:rgba(201,168,76,0.1);color:var(--gold-dark)}
.team-sel{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.team-btn{padding:12px;border:2px solid var(--border);border-radius:10px;background:var(--cream);cursor:pointer;font-family:'Cairo',sans-serif;font-weight:600;color:var(--text-mid);display:flex;flex-direction:column;align-items:center;gap:6px;transition:var(--tr)}
.team-btn.active{border-color:var(--tc,var(--gold));background:rgba(201,168,76,0.1);color:var(--gold-dark)}
.team-btn .ti{font-size:24px}.team-btn .tn{font-size:12px}
.auth-foot{text-align:center;margin-top:18px;color:var(--text-mid);font-size:13px}
.auth-link{color:var(--gold-dark);font-weight:700;cursor:pointer;text-decoration:underline}

/* APP */
#app{display:none;min-height:100vh}
.layout{display:flex;min-height:100vh}
.sidebar{width:248px;min-height:100vh;background:linear-gradient(180deg,var(--deep-blue),var(--navy));display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto;border-left:1px solid rgba(201,168,76,0.2);flex-shrink:0;z-index:100;transition:transform .3s ease}
.sb-head{padding:20px 16px;border-bottom:1px solid rgba(201,168,76,0.2);display:flex;align-items:center;gap:12px}
.sb-cross{font-size:30px;color:var(--gold)}
.sb-title{font-family:'Amiri',serif;font-size:18px;font-weight:700;color:var(--gold)}
.sb-sub{font-size:11px;color:var(--text-light)}
.sb-user{padding:14px 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid rgba(201,168,76,0.15)}
.sb-avatar{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;border:2px solid rgba(201,168,76,0.4);flex-shrink:0;color:white}
.sb-name{color:white;font-weight:700;font-size:14px}
.sb-role{color:var(--gold-light);font-size:11px}
.sb-pts{margin:10px 14px;background:rgba(201,168,76,0.1);border:1px solid rgba(201,168,76,0.3);border-radius:10px;padding:10px 14px;display:flex;align-items:center;gap:8px;color:var(--gold);font-weight:900;font-size:16px}
.sb-nav{flex:1;padding:8px;display:flex;flex-direction:column;gap:3px}
.nav-btn{display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:10px;cursor:pointer;color:var(--text-light);font-weight:600;font-size:14px;transition:var(--tr);border:none;background:none;font-family:'Cairo',sans-serif;width:100%;text-align:right}
.nav-btn:hover{background:rgba(201,168,76,0.1);color:var(--gold-light);transform:translateX(-3px)}
.nav-btn.active{background:rgba(201,168,76,0.2);color:var(--gold);border:1px solid rgba(201,168,76,0.3)}
.nav-ico{font-size:18px}
.logout-btn{margin:10px 8px 14px;display:flex;align-items:center;gap:8px;padding:11px 14px;background:rgba(231,76,60,0.1);border:1px solid rgba(231,76,60,0.3);border-radius:10px;color:#FC6C5C;font-family:'Cairo',sans-serif;font-size:14px;font-weight:600;cursor:pointer;width:calc(100% - 16px);transition:var(--tr)}
.logout-btn:hover{background:rgba(231,76,60,0.2)}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.mob-header{display:none;align-items:center;justify-content:space-between;padding:12px 16px;background:var(--deep-blue);border-bottom:1px solid rgba(201,168,76,0.2);position:sticky;top:0;z-index:50}
.hamburger{background:none;border:none;color:var(--gold);font-size:24px;cursor:pointer;padding:4px}
.mob-title{font-family:'Amiri',serif;color:var(--gold);font-size:18px;font-weight:700}
.content{flex:1;padding:24px;max-width:1100px;width:100%;margin:0 auto}
.sb-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:99}

/* CARDS & COMMON */
.card{background:white;border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);border:1px solid var(--border);margin-bottom:16px}
.btn{display:inline-flex;align-items:center;gap:7px;padding:11px 22px;border-radius:10px;font-family:'Cairo',sans-serif;font-weight:600;font-size:14px;cursor:pointer;border:none;transition:var(--tr);white-space:nowrap}
.btn-primary{background:linear-gradient(135deg,var(--gold),var(--gold-dark));color:var(--deep-blue)}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(201,168,76,0.35)}
.btn-secondary{background:var(--navy);color:var(--gold);border:1px solid var(--border)}
.btn-outline{background:transparent;border:2px solid var(--gold);color:var(--gold-dark)}
.btn-outline:hover{background:var(--gold);color:var(--deep-blue)}
.btn-danger{background:var(--danger);color:white}
.btn-sm{padding:7px 14px;font-size:12px}
.btn:disabled{opacity:0.5;cursor:not-allowed;transform:none!important}
.fg{display:flex;flex-direction:column;margin-bottom:16px}
.fl{font-weight:600;margin-bottom:6px;color:var(--text-dark);font-size:13px;display:block}
.fi,.fs,.ft{width:100%;padding:11px 14px;border:2px solid var(--border);border-radius:10px;font-family:'Cairo',sans-serif;font-size:14px;color:var(--text-dark);background:var(--cream);transition:var(--tr);direction:rtl}
.fi:focus,.fs:focus,.ft:focus{outline:none;border-color:var(--gold);background:white;box-shadow:0 0 0 3px rgba(201,168,76,0.15)}
.ft{resize:vertical;min-height:90px}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.bdg{display:inline-flex;align-items:center;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700}
.bdg-s{background:rgba(39,174,96,0.1);color:#1E8449;border:1px solid rgba(39,174,96,0.3)}
.bdg-d{background:rgba(231,76,60,0.1);color:var(--danger);border:1px solid rgba(231,76,60,0.3)}
.bdg-w{background:rgba(243,156,18,0.1);color:var(--warning);border:1px solid rgba(243,156,18,0.3)}
.bdg-b{background:rgba(26,58,107,0.1);color:var(--blue);border:1px solid rgba(26,58,107,0.3)}
.msg{padding:11px 14px;border-radius:10px;font-size:13px;font-weight:600;margin-bottom:12px}
.msg-s{background:rgba(39,174,96,0.1);color:#1E8449;border:1px solid rgba(39,174,96,0.4)}
.msg-e{background:rgba(231,76,60,0.1);color:#C0392B;border:1px solid rgba(231,76,60,0.4)}
.msg-w{background:rgba(243,156,18,0.1);color:#B7770D;border:1px solid rgba(243,156,18,0.4)}
.msg-i{background:rgba(26,58,107,0.1);color:var(--blue);border:1px solid var(--border)}
.modal-bg{position:fixed;inset:0;background:rgba(10,22,40,0.7);display:flex;align-items:center;justify-content:center;z-index:1000;padding:16px;backdrop-filter:blur(4px)}
.modal{background:white;border-radius:var(--radius);padding:26px;width:100%;max-width:500px;max-height:90vh;overflow-y:auto;box-shadow:0 24px 60px rgba(0,0,0,0.3);animation:slideUp .3s ease}
.mh{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;padding-bottom:14px;border-bottom:2px solid var(--border)}
.mt2{font-family:'Amiri',serif;font-size:20px;font-weight:700;color:var(--deep-blue)}
.mc{background:none;border:none;font-size:20px;cursor:pointer;color:var(--text-light);line-height:1}
.mc:hover{color:var(--danger)}
.ph{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;flex-wrap:wrap;gap:10px}
.pt{font-family:'Amiri',serif;font-size:24px;font-weight:700;color:var(--deep-blue)}
.st{font-family:'Amiri',serif;font-size:17px;color:var(--deep-blue);margin-bottom:14px;font-weight:700}
.empty{text-align:center;padding:36px;color:var(--text-light);background:white;border-radius:var(--radius);border:2px dashed var(--border)}
.empty span{font-size:44px;display:block;margin-bottom:10px}
.li{display:flex;align-items:center;gap:12px;padding:12px;background:var(--cream);border-radius:12px;border:1px solid var(--border);margin-bottom:8px}
.lic{font-size:22px;flex-shrink:0}
.lii{flex:1}
.lit{font-weight:600;color:var(--text-dark);font-size:14px}
.lis{font-size:12px;color:var(--text-light);margin-top:2px}
.mt{margin-top:14px}
.mb{margin-bottom:12px}
.wf{width:100%}
.tc{text-align:center}
.tm{color:var(--text-light);font-size:13px}

/* DASHBOARD */
.hero{background:linear-gradient(135deg,var(--deep-blue),var(--blue));border-radius:20px;padding:24px;display:flex;align-items:center;justify-content:space-between;gap:14px;border:1px solid rgba(201,168,76,0.3);margin-bottom:20px;position:relative;overflow:hidden}
.hero::before{content:'✝';position:absolute;right:-20px;top:-20px;font-size:130px;color:rgba(255,255,255,0.04);pointer-events:none}
.hero-l{display:flex;align-items:center;gap:14px}
.hero-c{font-size:36px;color:var(--gold)}
.hero-t{font-family:'Amiri',serif;font-size:22px;color:white;margin-bottom:4px}
.hero-s{color:var(--gold-light);font-size:13px}
.hero-r{display:flex;gap:10px;flex-shrink:0}
.stat-p{background:rgba(255,255,255,0.08);border:1px solid rgba(201,168,76,0.3);border-radius:12px;padding:12px 16px;display:flex;align-items:center;gap:8px}
.stat-p>span{font-size:22px}
.stat-n{font-size:20px;font-weight:900;color:var(--gold);line-height:1}
.stat-l{font-size:10px;color:rgba(255,255,255,0.5)}
.teams-g{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.tc-card{background:white;border-radius:14px;padding:18px 14px;text-align:center;border:2px solid var(--border);transition:var(--tr);position:relative;box-shadow:var(--shadow)}
.tc-card:hover{transform:translateY(-4px);border-color:var(--tc,var(--gold))}
.tc-my{border-color:var(--tc,var(--gold))!important;background:rgba(201,168,76,0.02)}
.tc-rank{font-size:11px;font-weight:700;color:var(--text-light);margin-bottom:6px}
.tc-ico{font-size:32px;margin-bottom:6px}
.tc-name{font-weight:700;color:var(--text-dark);font-size:13px;margin-bottom:5px}
.tc-pts{font-size:15px;font-weight:900;color:var(--tc,var(--gold-dark))}
.crown{position:absolute;top:-10px;left:50%;transform:translateX(-50%);font-size:22px}

/* ATTENDANCE */
.act-card{background:linear-gradient(135deg,#fffdf5,#fff);border:2px solid var(--gold)}
.act-badge{display:inline-block;background:rgba(231,76,60,0.1);color:var(--danger);border:1px solid rgba(231,76,60,0.3);border-radius:20px;padding:3px 10px;font-size:11px;font-weight:700;margin-bottom:10px;animation:blink 1.5s ease infinite}
.mtg-t{font-family:'Amiri',serif;font-size:22px;color:var(--deep-blue);margin-bottom:5px}
.mtg-d{color:var(--text-mid);font-size:13px;margin-bottom:20px}
.srv-act{display:grid;grid-template-columns:auto 1fr;gap:24px;align-items:start}
.qr-box{text-align:center}
.qr-lbl{font-weight:700;font-size:13px;color:var(--text-mid);margin-bottom:10px}
.qr-wrap{background:var(--cream);border:3px solid var(--gold);border-radius:14px;padding:16px;display:inline-block}
.qr-hint{font-size:11px;color:var(--text-light);margin-top:8px}
.att-chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.att-chip{background:var(--cream);border:1px solid var(--border);border-radius:20px;padding:5px 12px;font-size:12px;font-weight:600}
.scan-res{padding:18px;border-radius:14px;text-align:center;font-size:15px;font-weight:700;margin-top:14px}
.scan-ok{background:rgba(39,174,96,0.1);border:2px solid rgba(39,174,96,0.4);color:#1E8449}
.scan-no{background:rgba(243,156,18,0.1);border:2px solid rgba(243,156,18,0.4);color:#B7770D}
.scan-err{background:rgba(231,76,60,0.1);border:2px solid rgba(231,76,60,0.4);color:#C0392B}

/* HOMEWORK */
.hw-card{background:white;border-radius:14px;padding:16px;border:2px solid var(--border);transition:var(--tr);display:flex;align-items:flex-start;gap:12px;box-shadow:var(--shadow);margin-bottom:12px}
.hw-card:hover{border-color:var(--gold)}
.hw-ico{font-size:28px;flex-shrink:0}
.hw-b{flex:1}
.hw-t{font-weight:700;color:var(--text-dark);font-size:15px;margin-bottom:3px}
.hw-d{font-size:12px;color:var(--text-mid);margin-bottom:3px}
.hw-due{font-size:11px;color:var(--danger);font-weight:600}
.sub-item{background:var(--cream);border-radius:12px;padding:14px;border:1px solid var(--border);margin-bottom:10px}
.sub-h{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:8px}
.sub-n{font-weight:700;color:var(--text-dark);font-size:14px}
.sub-f{display:inline-block;color:var(--blue);font-size:13px;font-weight:600;text-decoration:none;margin-bottom:6px}
.sub-g{font-size:13px;color:var(--text-dark);margin-top:6px}
.sub-c{font-size:12px;color:var(--text-mid);margin-top:3px;font-style:italic}
.up-area{border:2px dashed var(--border);border-radius:12px;padding:24px;text-align:center;cursor:pointer;background:var(--cream)}
.up-area:hover{border-color:var(--gold)}
.up-ico{font-size:36px;display:block;margin-bottom:6px}
.up-t{color:var(--text-mid);font-size:14px;font-weight:600}
.up-s{color:var(--text-light);font-size:11px}

/* COMPETITIONS */
.comp-g{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.comp-c{background:white;border-radius:16px;padding:20px;border:2px solid var(--border);box-shadow:var(--shadow);transition:var(--tr)}
.comp-c:hover{transform:translateY(-4px)}
.comp-act{border-color:var(--gold);background:linear-gradient(135deg,#fffdf5,white)}
.comp-ch{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.comp-ic{font-size:30px}
.comp-t{font-family:'Amiri',serif;font-size:18px;font-weight:700;color:var(--deep-blue);margin-bottom:6px}
.comp-d{color:var(--text-mid);font-size:13px;margin-bottom:12px}
.comp-m{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.comp-m span{font-size:11px;color:var(--text-light);background:var(--cream);padding:3px 8px;border-radius:16px;border:1px solid var(--border)}
.comp-a{display:flex;gap:8px;flex-wrap:wrap}
.quiz-w{max-width:640px;margin:0 auto}
.quiz-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;background:var(--deep-blue);padding:16px 20px;border-radius:14px}
.quiz-ti{color:var(--gold);font-family:'Amiri',serif;font-size:18px;font-weight:700}
.quiz-tm{color:white;font-size:20px;font-weight:900;background:rgba(255,255,255,0.1);padding:6px 14px;border-radius:8px}
.timer-d{color:var(--danger)!important;animation:blink .5s ease infinite}
.quiz-pb{height:5px;background:rgba(0,0,0,0.08);border-radius:3px;margin-bottom:10px}
.quiz-pf{height:100%;background:var(--gold);border-radius:3px;transition:width .3s ease}
.quiz-ct{color:var(--text-light);font-size:13px;margin-bottom:20px;text-align:center}
.quiz-qc{background:white;border-radius:18px;padding:28px;box-shadow:var(--shadow);border:1px solid var(--border)}
.quiz-qt{font-size:18px;font-weight:700;color:var(--deep-blue);margin-bottom:22px;text-align:center;line-height:1.5}
.quiz-os{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.quiz-o{display:flex;align-items:center;gap:10px;padding:14px;border:2px solid var(--border);border-radius:12px;background:var(--cream);cursor:pointer;font-family:'Cairo',sans-serif;font-size:14px;font-weight:600;color:var(--text-dark);transition:var(--tr);width:100%;text-align:right}
.quiz-o:hover{border-color:var(--gold)}
.o-sel{border-color:var(--gold)!important;background:rgba(201,168,76,0.12)!important;color:var(--gold-dark)!important}
.o-let{width:30px;height:30px;border-radius:50%;background:var(--deep-blue);color:var(--gold);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:13px;flex-shrink:0}
.o-sel .o-let{background:var(--gold);color:var(--deep-blue)}
.quiz-ft{display:flex;justify-content:space-between;align-items:center;margin-top:20px}
.res-card{background:white;border-radius:24px;padding:44px;text-align:center;max-width:380px;margin:32px auto;box-shadow:var(--shadow);border:2px solid var(--gold)}
.res-em{font-size:64px;margin-bottom:14px}
.res-ti{font-family:'Amiri',serif;font-size:26px;color:var(--deep-blue);margin-bottom:14px}
.res-sc{font-size:44px;font-weight:900;color:var(--gold-dark)}
.res-pc{font-size:18px;color:var(--text-mid);margin-bottom:10px}
.rr{display:flex;align-items:center;gap:12px;padding:12px;background:var(--cream);border-radius:12px;border:1px solid var(--border);margin-bottom:8px}
.rr-n{font-size:15px;font-weight:900;color:var(--gold-dark);width:28px;text-align:center}
.rr-i{flex:1}
.rr-nm{font-weight:700;color:var(--text-dark);font-size:14px}
.rr-tm{font-size:11px;color:var(--text-light)}
.rr-s{font-size:15px;font-weight:900;color:var(--gold-dark)}
.qb{background:var(--cream);border-radius:12px;padding:14px;margin-bottom:12px;border:1px solid var(--border)}
.qbh{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.qbn{font-weight:700;color:var(--gold-dark)}
.og{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.or{display:flex;align-items:center;gap:7px}
.cb{background:none;border:none;font-size:16px;cursor:pointer;flex-shrink:0;padding:3px}

/* TEAMS */
.l-ban{background:linear-gradient(135deg,var(--deep-blue),var(--navy));border:2px solid var(--tc,var(--gold));border-radius:18px;padding:22px 28px;display:flex;align-items:center;gap:16px;margin-bottom:20px}
.l-cr{font-size:44px;flex-shrink:0}
.l-nm{font-family:'Amiri',serif;font-size:24px;font-weight:700;color:var(--tc,var(--gold))}
.pod-g{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px}
.pod-c{background:white;border-radius:16px;padding:18px 14px;text-align:center;border:2px solid var(--border);cursor:pointer;transition:var(--tr);box-shadow:var(--shadow)}
.pod-c:hover{border-color:var(--tc,var(--gold));transform:translateY(-5px)}
.pod-r{font-size:20px;margin-bottom:8px}
.pod-i{font-size:40px;margin-bottom:8px}
.pod-n{font-weight:700;color:var(--text-dark);font-size:14px;margin-bottom:8px}
.pod-p{font-size:28px;font-weight:900;color:var(--tc,var(--gold-dark));line-height:1}
.pod-l{font-size:11px;color:var(--text-light);margin-bottom:10px}
.pod-bar{height:5px;background:rgba(0,0,0,0.06);border-radius:3px;margin-bottom:8px}
.pod-bf{height:100%;background:var(--tc,var(--gold));border-radius:3px;transition:width 1s ease}
.mem-g{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.mem-c{background:white;border-radius:14px;padding:18px 14px;text-align:center;border:1px solid var(--border);box-shadow:var(--shadow);transition:var(--tr);position:relative}
.mem-c:hover{transform:translateY(-3px);border-color:var(--tc,var(--gold))}
.mem-r{position:absolute;top:8px;right:10px;font-size:10px;font-weight:700;color:var(--text-light)}
.mem-av{width:48px;height:48px;border-radius:50%;margin:0 auto 8px;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;color:white}
.mem-nm{font-weight:700;color:var(--text-dark);font-size:13px;margin-bottom:5px}
.mem-pt{font-size:13px;font-weight:900;color:var(--tc,var(--gold-dark))}

/* SERVANT */
.srv-g{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px}
.srv-c{background:white;border-radius:14px;padding:20px;text-align:center;border:2px solid var(--border);box-shadow:var(--shadow);border-top:4px solid var(--sc,var(--gold))}
.srv-i{font-size:32px;margin-bottom:8px}
.srv-v{font-size:32px;font-weight:900;color:var(--sc,var(--gold-dark));line-height:1;margin-bottom:5px}
.srv-l{font-size:12px;color:var(--text-mid);font-weight:600}

@keyframes spin{to{transform:rotate(360deg)}}
@keyframes slideUp{from{transform:translateY(25px);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.5}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}

@media(max-width:768px){
  .sidebar{position:fixed;top:0;right:0;transform:translateX(100%);height:100%;z-index:100}
  .sidebar.open{transform:translateX(0)}
  .sb-overlay{display:block}
  .mob-header{display:flex}
  .content{padding:14px}
  .teams-g,.pod-g{grid-template-columns:repeat(2,1fr)}
  .srv-act{grid-template-columns:1fr}
  .quiz-os,.og{grid-template-columns:1fr}
  .srv-g{grid-template-columns:repeat(2,1fr)}
  .hero{flex-direction:column;align-items:flex-start}
  .hero-r{width:100%}
  .stat-p{flex:1;justify-content:center}
  .fr{grid-template-columns:1fr}
}
</style>
</head>
<body>

<!-- SPLASH -->
<div id="splash">
  <div class="sp-cross">✝</div>
  <div class="spin"></div>
  <p>شباب الكنيسة</p>
</div>

<!-- AUTH -->
<div id="auth">
  <div class="auth-card">
    <div class="auth-logo">
      <span class="auth-cross">✝</span>
      <h1 class="auth-title">شباب الكنيسة</h1>
    </div>
    <div class="auth-tabs">
      <button class="auth-tab active" id="tab-login" onclick="showTab('login')">تسجيل الدخول</button>
      <button class="auth-tab" id="tab-reg" onclick="showTab('reg')">حساب جديد</button>
    </div>

    <!-- Login -->
    <div id="frm-login">
      <div id="login-msg"></div>
      <div class="fg"><label class="fl">📧 البريد الإلكتروني</label><input type="email" class="fi" id="l-email" placeholder="example@church.com" autocomplete="email"/></div>
      <div class="fg"><label class="fl">🔒 كلمة المرور</label><input type="password" class="fi" id="l-pass" placeholder="••••••••" autocomplete="current-password"/></div>
      <button class="btn btn-primary wf" id="login-btn" onclick="doLogin()">🚪 دخول</button>
      <div class="auth-foot">ليس لديك حساب؟ <span class="auth-link" onclick="showTab('reg')">سجّل الآن</span></div>
    </div>

    <!-- Register -->
    <div id="frm-reg" style="display:none">
      <div id="reg-msg"></div>
      <div class="fg"><label class="fl">👤 الاسم الكامل *</label><input class="fi" id="r-name" placeholder="اسمك الكامل"/></div>
      <div class="fg"><label class="fl">📧 البريد الإلكتروني *</label><input type="email" class="fi" id="r-email" placeholder="example@church.com"/></div>
      <div class="fg"><label class="fl">📱 رقم الهاتف</label><input class="fi" id="r-phone" placeholder="01xxxxxxxxx"/></div>
      <div class="fg"><label class="fl">🔒 كلمة المرور *</label><input type="password" class="fi" id="r-pass" placeholder="6 أحرف على الأقل"/></div>
      <div class="fg">
        <label class="fl">🎭 أنا...</label>
        <div class="role-sel">
          <button class="role-btn active" id="rb-youth" onclick="selRole('youth')">🙋 شاب / فتاة</button>
          <button class="role-btn" id="rb-serv" onclick="selRole('servant')">⭐ خادم / خادمة</button>
        </div>
      </div>
      <div id="team-sec" class="fg">
        <label class="fl">⚔️ اختر فريقك</label>
        <div class="team-sel">
          <button class="team-btn" data-t="team_eagle" style="--tc:#E74C3C" onclick="selTeam(this)"><span class="ti">🦅</span><span class="tn">فريق النسر</span></button>
          <button class="team-btn" data-t="team_lion" style="--tc:#F39C12" onclick="selTeam(this)"><span class="ti">🦁</span><span class="tn">فريق الأسد</span></button>
          <button class="team-btn" data-t="team_bull" style="--tc:#27AE60" onclick="selTeam(this)"><span class="ti">🐂</span><span class="tn">فريق الثور</span></button>
          <button class="team-btn" data-t="team_human" style="--tc:#2980B9" onclick="selTeam(this)"><span class="ti">👤</span><span class="tn">فريق الإنسان</span></button>
        </div>
      </div>
      <button class="btn btn-primary wf" id="reg-btn" onclick="doRegister()">✅ إنشاء الحساب</button>
      <div class="auth-foot">لديك حساب؟ <span class="auth-link" onclick="showTab('login')">سجّل دخولك</span></div>
    </div>
  </div>
</div>

<!-- APP -->
<div id="app">
  <div class="layout">
    <div class="sb-overlay" id="sb-ov" onclick="toggleSB()"></div>
    <aside class="sidebar" id="sidebar">
      <div class="sb-head">
        <span class="sb-cross">✝</span>
        <div><div class="sb-title">شباب الكنيسة</div><div class="sb-sub">مرحباً بكم</div></div>
      </div>
      <div class="sb-user">
        <div class="sb-avatar" id="sb-av" style="background:#C9A84C">?</div>
        <div><div class="sb-name" id="sb-nm">...</div><div class="sb-role" id="sb-rl">...</div></div>
      </div>
      <div class="sb-pts" id="sb-pt">0 🌟</div>
      <nav class="sb-nav">
        <button class="nav-btn active" data-p="dashboard" onclick="go('dashboard')"><span class="nav-ico">🏠</span> الرئيسية</button>
        <button class="nav-btn" data-p="attendance" onclick="go('attendance')"><span class="nav-ico">✅</span> الحضور</button>
        <button class="nav-btn" data-p="homework" onclick="go('homework')"><span class="nav-ico">📚</span> الواجبات</button>
        <button class="nav-btn" data-p="competitions" onclick="go('competitions')"><span class="nav-ico">🏆</span> المسابقات</button>
        <button class="nav-btn" data-p="teams" onclick="go('teams')"><span class="nav-ico">⚔️</span> الفرق</button>
        <button class="nav-btn" data-p="servant" id="serv-nav" onclick="go('servant')" style="display:none"><span class="nav-ico">👑</span> لوحة الخدام</button>
      </nav>
      <button class="logout-btn" onclick="doLogout()">🚪 تسجيل الخروج</button>
    </aside>
    <div class="main">
      <header class="mob-header">
        <button class="hamburger" onclick="toggleSB()">☰</button>
        <span class="mob-title">✝ شباب الكنيسة</span>
        <span id="mob-pts" style="color:var(--gold-light);font-weight:700;font-size:13px">0 🌟</span>
      </header>
      <div class="content" id="pg"></div>
    </div>
  </div>
</div>

<script type="module">
// ── Firebase Imports ──────────────────────────────────
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
import { getFirestore, collection, doc, getDoc, getDocs, setDoc, addDoc, updateDoc, query, where, orderBy, serverTimestamp, limit } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
import { getStorage, ref as sRef, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js";

const FB = {
  apiKey:"AIzaSyBT43B29gAgH6ufXOkXQWy-RIj9yDQXkuE",
  authDomain:"attendance-church-1-e10c7.firebaseapp.com",
  projectId:"attendance-church-1-e10c7",
  storageBucket:"attendance-church-1-e10c7.firebasestorage.app",
  messagingSenderId:"773950808320",
  appId:"1:773950808320:web:1c6b066915563e20ddd3e5"
};
const fbApp = initializeApp(FB);
const auth = getAuth(fbApp);
const db = getFirestore(fbApp);
const storage = getStorage(fbApp);

// ── State ─────────────────────────────────────────────
let CU = null;
let activeMtg = null;
let qState = null;
let qData = [];
let curHW = null;
let curSub = null;
const TEAMS = [
  {id:"team_eagle",name:"فريق النسر",color:"#E74C3C",icon:"🦅",total_points:0},
  {id:"team_lion",name:"فريق الأسد",color:"#F39C12",icon:"🦁",total_points:0},
  {id:"team_bull",name:"فريق الثور",color:"#27AE60",icon:"🐂",total_points:0},
  {id:"team_human",name:"فريق الإنسان",color:"#2980B9",icon:"👤",total_points:0},
];

// ── Bootstrap (runs only once per session) ────────────
let bootstrapDone = false;
async function bootstrap() {
  if (bootstrapDone) return;
  bootstrapDone = true;
  for (const t of TEAMS) {
    const s = await getDoc(doc(db,"teams",t.id));
    if (!s.exists()) await setDoc(doc(db,"teams",t.id), t);
  }
}

// ── Auth Listener ─────────────────────────────────────
onAuthStateChanged(auth, async (fbUser) => {
  if (fbUser) {
    try {
      showMsg('login-msg', '⏳ جاري تهيئة البيانات...', 'info');
      await bootstrap();
      showMsg('login-msg', '⏳ جاري تحميل بيانات المستخدم...', 'info');
      const snap = await getDoc(doc(db,"users",fbUser.uid));
      if (!snap.exists()) {
        // User exists in auth but not firestore — sign out
        await signOut(auth);
        show('auth','flex');
        showMsg('login-msg', '❌ الحساب غير مكتمل، تواصل مع الإدارة', 'error');
        return;
      }
      CU = {id:snap.id, ...snap.data()};
      if (CU.team_id) {
        const ts = await getDoc(doc(db,"teams",CU.team_id));
        if (ts.exists()) CU.team = {id:ts.id, ...ts.data()};
      }
      // Update sidebar
      E('sb-av').textContent = CU.team?.icon || CU.name?.[0] || '?';
      E('sb-av').style.background = CU.team?.color || '#C9A84C';
      E('sb-nm').textContent = CU.name;
      E('sb-rl').textContent = CU.role==='servant' ? '⭐ خادم' : `فريق ${CU.team?.name||'غير محدد'} ${CU.team?.icon||''}`;
      refreshPts();
      E('serv-nav').style.display = CU.role==='servant' ? 'flex' : 'none';
      // Show app
      hide('splash'); hide('auth');
      show('app','flex');
      go('dashboard');
    } catch(e) {
      console.error(e);
      hide('splash');
      show('auth','flex');
      showMsg('login-msg', '❌ خطأ في التحميل: ' + e.message + '<br><small style="opacity:0.7">كود: '+e.code+'</small>', 'error');
    }
  } else {
    CU = null;
    hide('splash');
    hide('app');
    show('auth','flex');
  }
});

function refreshPts() {
  const pts = CU?.total_points || 0;
  E('sb-pt').textContent = `${pts} 🌟`;
  E('mob-pts').textContent = `${pts} 🌟`;
}

// ── Helpers ───────────────────────────────────────────
const E = id => document.getElementById(id);
const hide = id => { const el=E(id); if(el) el.style.display='none'; };
const show = (id, d='block') => { const el=E(id); if(el) el.style.display=d; };
const pg = html => { E('pg').innerHTML = html; };
const fmt = s => `${Math.floor(s/60).toString().padStart(2,'0')}:${(s%60).toString().padStart(2,'0')}`;

function showMsg(id, text, type) {
  const el = E(id); if (!el) return;
  const cls = type==='success'?'msg-s':type==='error'?'msg-e':type==='warning'?'msg-w':'msg-i';
  el.innerHTML = `<div class="msg ${cls}">${text}</div>`;
  if (type==='success') setTimeout(()=>{if(el) el.innerHTML='';}, 3000);
}

window.closeM = id => { const el=E(id); if(el) el.style.display='none'; };
window.openM = id => { const el=E(id); if(el) el.style.display='flex'; };
window.toggleSB = () => E('sidebar').classList.toggle('open');

// ── Auth UI ───────────────────────────────────────────
window.showTab = (t) => {
  show('frm-login', t==='login'?'block':'none');
  show('frm-reg', t==='reg'?'block':'none');
  E('tab-login').classList.toggle('active', t==='login');
  E('tab-reg').classList.toggle('active', t==='reg');
};
window.selRole = (r) => {
  E('rb-youth').classList.toggle('active', r==='youth');
  E('rb-serv').classList.toggle('active', r==='servant');
  E('team-sec').style.display = r==='youth'?'flex':'none';
};
window.selTeam = (btn) => {
  document.querySelectorAll('.team-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
};

// ── LOGIN ─────────────────────────────────────────────
window.doLogin = async () => {
  const email = E('l-email').value.trim();
  const pass = E('l-pass').value;
  if (!email || !pass) { showMsg('login-msg','⚠️ أدخل البريد وكلمة المرور','warning'); return; }
  const btn = E('login-btn');
  btn.disabled = true;
  btn.innerHTML = '<span class="loader-sm"></span> جاري الدخول...';
  showMsg('login-msg', '⏳ جاري الاتصال بالسيرفر...', 'info');
  try {
    showMsg('login-msg', '⏳ جاري التحقق من البيانات...', 'info');
    const cred = await signInWithEmailAndPassword(auth, email, pass);
    showMsg('login-msg', '✅ تم التحقق، جاري تحميل بياناتك...', 'success');
    // onAuthStateChanged will handle the rest
  } catch(e) {
    const errMap = {
      'auth/user-not-found': '❌ البريد غير مسجل',
      'auth/wrong-password': '❌ كلمة المرور غير صحيحة',
      'auth/invalid-credential': '❌ البريد أو كلمة المرور غير صحيحة',
      'auth/invalid-email': '❌ صيغة البريد غير صحيحة',
      'auth/too-many-requests': '❌ محاولات كثيرة، حاول بعد قليل',
      'auth/network-request-failed': '❌ لا يوجد اتصال بالإنترنت',
    };
    showMsg('login-msg', (errMap[e.code] || '❌ خطأ: '+e.message) + '<br><small style="opacity:0.7">كود الخطأ: '+e.code+'</small>', 'error');
  } finally {
    btn.disabled = false;
    btn.innerHTML = '🚪 دخول';
  }
};

// ── REGISTER ──────────────────────────────────────────
window.doRegister = async () => {
  const name = E('r-name').value.trim();
  const email = E('r-email').value.trim();
  const pass = E('r-pass').value;
  const phone = E('r-phone').value.trim();
  const role = E('rb-serv').classList.contains('active') ? 'servant' : 'youth';
  const teamBtn = document.querySelector('.team-btn.active');
  const teamId = teamBtn?.dataset.t || '';
  if (!name||!email||!pass) { showMsg('reg-msg','⚠️ أكمل الحقول المطلوبة','warning'); return; }
  if (pass.length < 6) { showMsg('reg-msg','⚠️ كلمة المرور 6 أحرف على الأقل','warning'); return; }
  if (role==='youth' && !teamId) { showMsg('reg-msg','⚠️ اختر فريقك','warning'); return; }
  const btn = E('reg-btn');
  btn.disabled = true;
  btn.innerHTML = '<span class="loader-sm"></span> جاري التسجيل...';
  try {
    const cred = await createUserWithEmailAndPassword(auth, email, pass);
    await setDoc(doc(db,"users",cred.user.uid), {
      uid: cred.user.uid, name, phone, role,
      team_id: role==='youth' ? teamId : '',
      total_points: 0, created_at: serverTimestamp()
    });
    // onAuthStateChanged handles showing app
  } catch(e) {
    const errMap = {
      'auth/email-already-in-use': '❌ البريد مستخدم بالفعل',
      'auth/invalid-email': '❌ صيغة البريد غير صحيحة',
      'auth/weak-password': '❌ كلمة المرور ضعيفة جداً',
    };
    showMsg('reg-msg', errMap[e.code] || '❌ '+e.message, 'error');
    btn.disabled = false;
    btn.innerHTML = '✅ إنشاء الحساب';
  }
};

window.doLogout = async () => { await signOut(auth); };

// ── NAVIGATION ────────────────────────────────────────
window.go = (page) => {
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.toggle('active', b.dataset.p===page));
  E('sidebar').classList.remove('open');
  pg('<div class="loader-wrap"><div class="spin"></div></div>');
  renderPage(page).catch(e => pg(`<div class="card"><div class="msg msg-e">❌ ${e.message}</div></div>`));
};

async function renderPage(p) {
  switch(p) {
    case 'dashboard': return pgDash();
    case 'attendance': return pgAtt();
    case 'homework': return pgHW();
    case 'competitions': return pgComp();
    case 'teams': return pgTeams();
    case 'servant': return pgServ();
  }
}

// ════════════════════════════════════════════════════════
// DASHBOARD
// ════════════════════════════════════════════════════════
async function pgDash() {
  const [teamsSnap, attSnap] = await Promise.all([
    getDocs(collection(db,'teams')),
    getDocs(query(collection(db,'attendance'), where('user_id','==',CU.id)))
  ]);
  const teams = teamsSnap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>b.total_points-a.total_points);
  const att = attSnap.docs.map(d=>d.data());
  const myTeam = teams.find(t=>t.id===CU.team_id);

  const teamsH = teams.map((t,i)=>`
    <div class="tc-card ${CU.team_id===t.id?'tc-my':''}" style="--tc:${t.color}">
      ${i===0?'<div class="crown">👑</div>':''}
      <div class="tc-rank">#${i+1}</div>
      <div class="tc-ico">${t.icon}</div>
      <div class="tc-name">${t.name}</div>
      <div class="tc-pts">${t.total_points} نقطة</div>
    </div>`).join('');

  const attH = att.length===0
    ? '<div class="empty"><span>📋</span><p>لم يتم تسجيل حضور بعد</p></div>'
    : att.slice(0,5).map(a=>`<div class="li"><span class="lic">✅</span><div class="lii"><div class="lit">اجتماع</div></div><div style="font-weight:700;color:var(--gold-dark)">+${a.points_earned||10} 🌟</div></div>`).join('');

  pg(`
    <div class="hero">
      <div class="hero-l"><span class="hero-c">✝</span><div>
        <div class="hero-t">مرحباً، ${CU.name.split(' ')[0]} 👋</div>
        <div class="hero-s">${CU.role==='servant'?'⭐ خادم مبارك في خدمتك':`فريق ${myTeam?.name||'غير محدد'} ${myTeam?.icon||''}`}</div>
      </div></div>
      <div class="hero-r">
        <div class="stat-p"><span>🌟</span><div><div class="stat-n">${CU.total_points||0}</div><div class="stat-l">نقاطي</div></div></div>
        <div class="stat-p"><span>✅</span><div><div class="stat-n">${att.length}</div><div class="stat-l">حضور</div></div></div>
      </div>
    </div>
    <div class="card"><div class="st">⚔️ ترتيب الفرق</div><div class="teams-g">${teamsH}</div></div>
    <div class="card"><div class="st">📅 سجل حضوري</div>${attH}</div>`);
}

// ════════════════════════════════════════════════════════
// ATTENDANCE
// ════════════════════════════════════════════════════════
async function pgAtt() {
  // Get active meeting without orderBy to avoid index issues
  const mtgSnap = await getDocs(query(collection(db,'meetings'), where('is_active','==',true)));
  activeMtg = mtgSnap.empty ? null : {id:mtgSnap.docs[0].id, ...mtgSnap.docs[0].data()};

  const allMtgSnap = await getDocs(collection(db,'meetings'));
  const allMtgs = allMtgSnap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.created_at?.seconds||0)-(a.created_at?.seconds||0));

  let topH = '';
  if (activeMtg) {
    if (CU.role==='servant') {
      const [attSnap, usersSnap] = await Promise.all([
        getDocs(query(collection(db,'attendance'), where('meeting_id','==',activeMtg.id))),
        getDocs(collection(db,'users'))
      ]);
      const attList = attSnap.docs.map(d=>d.data());
      const allUsers = usersSnap.docs.map(d=>({id:d.id,...d.data()}));
      const youth = allUsers.filter(u=>u.role==='youth');

              <div class="qr-hint">اعرض هذا الكود للشباب</div>
            </div>
            <div>
              <div class="st">تسجيل يدوي</div>
              <div id="man-msg"></div>
              <select class="fs" id="man-sel"><option value="">اختر الشاب...</option>${opts}</select>
              <button class="btn btn-primary mt" onclick="manRec()">✅ تسجيل الحضور</button>
              <div class="st mt">👥 الحاضرون (${enriched.length})</div>
              <div class="att-chips">${chips||'<p class="tm">لا يوجد حاضرون بعد</p>'}</div>
            </div>
          </div>
        </div>`;
    } else {
      topH = `
        <div class="card act-card">
          <div class="act-badge">🔴 اجتماع نشط</div>
          <div class="mtg-t">${activeMtg.title}</div>
          <div class="mtg-d">📅 ${activeMtg.meeting_date||''}</div>
          <div class="tc" style="padding:20px">
            <button class="btn btn-primary" style="font-size:16px;padding:14px 32px" onclick="doScan()">📷 امسح QR Code للتسجيل</button>
            <div id="scan-res"></div>
          </div>
        </div>`;
    }
  } else {
    topH = `<div class="card"><div class="empty"><span>📅</span><p>لا يوجد اجتماع نشط الآن</p></div></div>`;
  }

  const mtgH = allMtgs.length===0
    ? '<div class="empty"><span>📋</span><p>لا توجد اجتماعات</p></div>'
    : allMtgs.map(m=>`<div class="li"><span class="lic">${m.is_active?'🟢':'⚪'}</span><div class="lii"><div class="lit">${m.title}</div><div class="lis">${m.meeting_date||''} ${m.meeting_time||''}</div></div>${m.is_active?'<span class="bdg bdg-s">نشط</span>':''}</div>`).join('');

  pg(`
    <div class="ph">
      <h1 class="pt">✅ الحضور</h1>
      ${CU.role==='servant'?'<button class="btn btn-primary" onclick="openM(\'m-mtg\')">+ إنشاء اجتماع</button>':''}

      <div class="modal" onclick="event.stopPropagation()">
        <div class="mh"><h2 class="mt2">➕ إنشاء اجتماع</h2><button class="mc" onclick="closeM('m-mtg')">✕</button></div>
        <div id="mtg-msg"></div>
        <div class="fg"><label class="fl">العنوان *</label><input class="fi" id="mtg-tl" placeholder="اجتماع الأحد"/></div>
        <div class="fr">
          <div class="fg"><label class="fl">التاريخ</label><input type="date" class="fi" id="mtg-dt"/></div>
          <div class="fg"><label class="fl">الوقت</label><input type="time" class="fi" id="mtg-tm"/></div>

window.manRec = async () => {
  const uid = E('man-sel')?.value;
  if (!uid||!activeMtg) return;
  const r = await recAtt(uid, activeMtg.id, CU.id);
  showMsg('man-msg', r.already?'⚠️ سُجّل مسبقاً':'✅ تم التسجيل! +10 نقاط 🌟', r.already?'warning':'success');
  if (!r.already) setTimeout(()=>go('attendance'), 1500);
};

window.doScan = async () => {
  if (!activeMtg) return;
  const code = prompt('أدخل كود QR الاجتماع:');
  if (!code) return;
  const snap = await getDocs(query(collection(db,'meetings'),where('qr_code','==',code.trim()),where('is_active','==',true)));
  const el = E('scan-res'); if (!el) return;
  if (snap.empty) { el.innerHTML='<div class="scan-res scan-err">❌ كود غير صالح</div>'; return; }
  const r = await recAtt(CU.id, snap.docs[0].id, null);
  el.innerHTML = `<div class="scan-res ${r.already?'scan-no':'scan-ok'}">${r.already?'⚠️ سُجّلت مسبقاً':'✅ تم تسجيل حضورك! +10 نقاط 🌟'}</div>`;
  if (!r.already) { await getDoc(doc(db,'users',CU.id)).then(s=>{if(s.exists())CU.total_points=(s.data().total_points||0);refreshPts();}); }
};

window.createMtg = async () => {
  const tl = E('mtg-tl')?.value?.trim();
  if (!tl) { showMsg('mtg-msg','⚠️ أدخل العنوان','warning'); return; }
  if (activeMtg) await updateDoc(doc(db,'meetings',activeMtg.id),{is_active:false});
  const qr = `mtg_${Date.now()}_${Math.random().toString(36).substr(2,9)}`;
  await addDoc(collection(db,'meetings'),{title:tl,meeting_date:E('mtg-dt').value,meeting_time:E('mtg-tm').value,qr_code:qr,is_active:true,created_by:CU.id,created_at:serverTimestamp()});
  closeM('m-mtg');
  go('attendance');
};

async function recAtt(userId, meetingId, servantId) {
  const id = `${userId}_${meetingId}`;
  const ex = await getDoc(doc(db,'attendance',id));
  if (ex.exists()) return {already:true};
  const us = await getDoc(doc(db,'users',userId));
  const ud = us.exists() ? us.data() : {};
  await setDoc(doc(db,'attendance',id),{user_id:userId,meeting_id:meetingId,scanned_by:servantId||'',points_earned:10,scanned_at:serverTimestamp()});
  // Update points
  await updateDoc(doc(db,'users',userId),{total_points:(ud.total_points||0)+10});
  if (ud.team_id) {
    const ts = await getDoc(doc(db,'teams',ud.team_id));
    if (ts.exists()) await updateDoc(doc(db,'teams',ud.team_id),{total_points:(ts.data().total_points||0)+10});
  }
  return {already:false};
}

window.submitHW = async () => {
  const file = E('hw-fi')?.files[0];
  if (!file) { showMsg('sub-msg','⚠️ اختر ملف أولاً','warning'); return; }
  const btn = E('sub-btn');
  btn.disabled=true; btn.innerHTML='<span class="loader-sm"></span> جاري الرفع...';
  try {
    const path = `homework/${curHW}/${CU.id}/${Date.now()}_${file.name}`;
    const sr = sRef(storage, path);
    await uploadBytes(sr, file);
    const url = await getDownloadURL(sr);
    await setDoc(doc(db,'homework_submissions',`${curHW}_${CU.id}`),{homework_id:curHW,user_id:CU.id,file_url:url,file_type:file.type,status:'pending',submitted_at:serverTimestamp()});
    closeM('m-sub');
    showMsg('hw-msg','✅ تم تسليم الواجب بنجاح!','success');
  } catch(e) { showMsg('sub-msg','❌ '+e.message,'error'); }
  btn.disabled=false; btn.innerHTML='📤 تسليم';
};

window.showSubs = async (hwId, title) => {
  const panel = E('subs-panel'); if (!panel) return;
  panel.innerHTML='<div class="loader-wrap"><div class="spin"></div></div>';
  const snap = await getDocs(query(collection(db,'homework_submissions'),where('homework_id','==',hwId)));
  const subs = snap.docs.map(d=>({id:d.id,...d.data()}));
  const enr = await Promise.all(subs.map(async s=>{
    const u=await getDoc(doc(db,'users',s.user_id)); if(u.exists())s.uname=u.data().name; return s;
  }));
  const ST={pending:'⏳ قيد المراجعة',approved:'✅ مقبول',needs_revision:'🔄 يحتاج مراجعة'};
  const h = enr.map(s=>`
    <div class="sub-item">
      <div class="sub-h"><div class="sub-n">${s.uname||'مجهول'}</div><span class="bdg ${s.status==='approved'?'bdg-s':s.status==='needs_revision'?'bdg-d':'bdg-w'}">${ST[s.status]||s.status}</span></div>
      ${s.file_url?`<a href="${s.file_url}" target="_blank" class="sub-f">${s.file_type?.startsWith('image')?'🖼️ عرض الصورة':'📄 تحميل الملف'}</a>`:''}
      ${s.grade?`<div class="sub-g">الدرجة: <strong>${s.grade}/100</strong>${s.servant_feedback?`<p class="sub-c">${s.servant_feedback}</p>`:''}</div>`:''}
      ${s.status==='pending'?`<button class="btn btn-secondary btn-sm mt" onclick="showRev('${s.id}','${(s.uname||'').replace(/'/g,"\\'")}','${s.file_url||''}')">✏️ تصحيح</button>`:''}
    </div>`).join('') || '<div class="empty"><span>📭</span><p>لا توجد تسليمات بعد</p></div>';
  panel.innerHTML=`<div class="card"><div class="st">📬 تسليمات: ${title}</div>${h}</div>`;
  panel.scrollIntoView({behavior:'smooth'});
};

window.openCreateC = () => { qData=[{text:'',opts:['','','',''],correct:0}]; renderQs(); openM('m-cc'); };
window.addQ2 = () => { qData.push({text:'',opts:['','','',''],correct:0}); renderQs(); };
window.rmQ = (i) => { qData.splice(i,1); renderQs(); };
window.setC = (qi,oi) => { qData[qi].correct=oi; renderQs(); };

function renderQs() {
  const c=E('qs'); if(!c) return;
  c.innerHTML = qData.map((q,qi)=>`
    <div class="qb">
      <div class="qbh"><span class="qbn">س${qi+1}</span>${qData.length>1?`<button type="button" class="btn btn-danger btn-sm" onclick="rmQ(${qi})">حذف</button>`:''}</div>
      <input class="fi mb" placeholder="نص السؤال..." value="${q.text}" oninput="qData[${qi}].text=this.value"/>
      <div class="og">${q.opts.map((o,oi)=>`
        <div class="or">
          <button type="button" class="cb" onclick="setC(${qi},${oi})">${q.correct===oi?'✅':'⬜'}</button>
          <input class="fi" placeholder="${['أ','ب','ج','د'][oi]}" value="${o}" oninput="qData[${qi}].opts[${oi}]=this.value"/>
        </div>`).join('')}
      </div>
    </div>`).join('');
}

  go('competitions');
};

window.startQ = async (compId) => {
  const s=await getDoc(doc(db,'competitions',compId));
  const comp={id:s.id,...s.data()};
  qState={comp,ans:new Array(comp.questions.length).fill(null),cur:0,t0:Date.now(),tl:comp.time_limit_minutes*60};
  E('comp-cards').style.display='none';
  document.querySelector('.ph').style.display='none';
  renderQuiz();
  qState.tmr=setInterval(()=>{qState.tl--;if(qState.tl<=0){clearInterval(qState.tmr);finishQ();}else{const el=E('qtm');if(el){el.textContent='⏱️ '+fmt(qState.tl);if(qState.tl<60)el.classList.add('timer-d');}}},1000);
};

function renderQuiz() {
  const {comp,ans,cur,tl}=qState; const q=comp.questions[cur];
  E('quiz-area').innerHTML=`
    <div class="quiz-w">
      <div class="quiz-hd"><div class="quiz-ti">${comp.title}</div><div class="quiz-tm" id="qtm">⏱️ ${fmt(tl)}</div></div>
      <div class="quiz-pb"><div class="quiz-pf" style="width:${(cur/comp.questions.length)*100}%"></div></div>
      <div class="quiz-ct">السؤال ${cur+1} من ${comp.questions.length}</div>
      <div class="quiz-qc">
        <div class="quiz-qt">${q.text}</div>
        <div class="quiz-os">${q.options.map((o,i)=>`<button class="quiz-o ${ans[cur]===i?'o-sel':''}" onclick="selA(${i})"><span class="o-let">${['أ','ب','ج','د'][i]}</span><span>${o}</span></button>`).join('')}</div>
      </div>
      <div class="quiz-ft">
        ${cur>0?`<button class="btn btn-outline" onclick="qNav(-1)">◀ السابق</button>`:'<div></div>'}
        ${cur<comp.questions.length-1?`<button class="btn btn-primary" onclick="qNav(1)" ${ans[cur]===null?'disabled':''}>التالي ▶</button>`:`<button class="btn btn-primary" onclick="finishQ()">✅ إنهاء</button>`}
      </div>
    </div>`;
}

window.selA=(i)=>{qState.ans[qState.cur]=i;renderQuiz();};
window.qNav=(d)=>{qState.cur+=d;renderQuiz();};

window.finishQ = async () => {
  clearInterval(qState.tmr);
  const {comp,ans,t0}=qState;
  let score=0;
  ans.forEach((a,i)=>{if(comp.questions[i]&&a===comp.questions[i].correct_answer)score+=comp.points_per_question;});
  const total=comp.questions.length*comp.points_per_question;
  const pct=Math.round((score/total)*100);
  try {
    await setDoc(doc(db,'competition_answers',`${comp.id}_${CU.id}`),{competition_id:comp.id,user_id:CU.id,team_id:CU.team_id||'',answers:ans,score,time_taken_seconds:Math.floor((Date.now()-t0)/1000),submitted_at:serverTimestamp()});
    const us=await getDoc(doc(db,'users',CU.id));
    const curPts=us.exists()?us.data().total_points||0:0;
    await updateDoc(doc(db,'users',CU.id),{total_points:curPts+score});
    CU.total_points=curPts+score; refreshPts();
    if(CU.team_id){const ts=await getDoc(doc(db,'teams',CU.team_id));if(ts.exists())await updateDoc(doc(db,'teams',CU.team_id),{total_points:(ts.data().total_points||0)+score});}
  }catch(e){}
  E('quiz-area').innerHTML=`
    <div class="res-card">
      <div class="res-em">${pct>=70?'🏆':pct>=50?'🌟':'📚'}</div>
      <h2 class="res-ti">${pct>=70?'ممتاز!':pct>=50?'جيد جداً!':'حاول مرة أخرى'}</h2>
      <div class="res-sc">${score} / ${total}</div>
      <div class="res-pc">${pct}%</div>
      <p style="color:var(--text-light);margin:10px 0">تم احتساب النقاط لفريقك 🎉</p>
      <button class="btn btn-primary mt" onclick="go('competitions')">العودة</button>
    </div>`;
};

window.showRes = async (compId, title) => {
  E('res-t').textContent='📊 '+title;
  E('res-b').innerHTML='<div class="loader-wrap"><div class="spin"></div></div>';
  openM('m-res');
  const snap=await getDocs(query(collection(db,'competition_answers'),where('competition_id','==',compId)));
  const list=snap.docs.map(d=>({id:d.id,...d.data()}));
  const enr=await Promise.all(list.map(async r=>{
    const u=await getDoc(doc(db,'users',r.user_id));if(u.exists())r.uname=u.data().name;
    if(r.team_id){const t=await getDoc(doc(db,'teams',r.team_id));if(t.exists())r.team=t.data();}
    return r;
  }));
  enr.sort((a,b)=>b.score-a.score);
  E('res-b').innerHTML=enr.length===0
    ?'<div class="empty"><span>📭</span><p>لا توجد نتائج بعد</p></div>'
    :enr.map((r,i)=>`<div class="rr"><span class="rr-n">#${i+1}</span><span>${r.team?.icon||'👤'}</span><div class="rr-i"><div class="rr-nm">${r.uname||'مجهول'}</div><div class="rr-tm">${r.team?.name||''}</div></div><div class="rr-s">${r.score} 🌟</div></div>`).join('');
};

// ════════════════════════════════════════════════════════
// TEAMS
// ════════════════════════════════════════════════════════
async function pgTeams() {
  const [tSnap, uSnap] = await Promise.all([getDocs(collection(db,'teams')), getDocs(collection(db,'users'))]);
  const teams = tSnap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>b.total_points-a.total_points);
  const users = uSnap.docs.map(d=>({id:d.id,...d.data()}));
  const maxP = Math.max(...teams.map(t=>t.total_points),1);
  const leader = teams[0];

  const podH = teams.map((t,i)=>`
    <div class="pod-c" style="--tc:${t.color}" onclick="showMem('${t.id}')">
      <div class="pod-r">${i===0?'🥇':i===1?'🥈':i===2?'🥉':'#'+(i+1)}</div>
      <div class="pod-i">${t.icon}</div>
      <div class="pod-n">${t.name}</div>
      <div class="pod-p">${t.total_points}</div>
      <div class="pod-l">نقطة</div>
      <div class="pod-bar"><div class="pod-bf" style="width:${(t.total_points/maxP)*100}%"></div></div>
      <div style="font-size:12px;color:var(--text-light)">${users.filter(u=>u.team_id===t.id&&u.role==='youth').length} عضو</div>
    </div>`).join('');

  pg(`
    <div class="ph"><h1 class="pt">⚔️ الفرق</h1></div>
    ${leader?`<div class="l-ban" style="--tc:${leader.color}"><div class="l-cr">👑</div><div><div style="font-size:11px;color:rgba(255,255,255,0.5)">الفريق الأول</div><div class="l-nm">${leader.icon} ${leader.name}</div><div style="color:rgba(255,255,255,0.8);font-weight:700">${leader.total_points} نقطة</div></div></div>`:''}
    <div class="pod-g">${podH}</div>
    <div id="mem-panel"></div>`);
}

window.showMem = async (teamId) => {
  const [tSnap, uSnap] = await Promise.all([getDocs(collection(db,'teams')), getDocs(collection(db,'users'))]);
  const teams = tSnap.docs.map(d=>({id:d.id,...d.data()}));
  const team = teams.find(t=>t.id===teamId);
  const members = uSnap.docs.map(d=>({id:d.id,...d.data()})).filter(u=>u.team_id===teamId&&u.role==='youth').sort((a,b)=>(b.total_points||0)-(a.total_points||0));
  const panel=E('mem-panel');
  panel.innerHTML=`<div class="card"><div class="st" style="color:${team?.color}">${team?.icon} أعضاء ${team?.name}</div>${
    members.length===0?'<div class="empty"><span>👥</span><p>لا يوجد أعضاء بعد</p></div>'
    :`<div class="mem-g">${members.map((m,i)=>`<div class="mem-c" style="--tc:${team?.color}"><div class="mem-r">#${i+1}</div><div class="mem-av" style="background:${team?.color}">${m.name?.[0]||'?'}</div><div class="mem-nm">${m.name}</div><div class="mem-pt">${m.total_points||0} 🌟</div></div>`).join('')}</div>`
  }</div>`;
  panel.scrollIntoView({behavior:'smooth'});
};

// ════════════════════════════════════════════════════════
// SERVANT
// ════════════════════════════════════════════════════════
async function pgServ() {
  const [uSnap, mSnap, hSnap, cSnap] = await Promise.all([
    getDocs(collection(db,'users')), getDocs(collection(db,'meetings')),
    getDocs(collection(db,'homework')), getDocs(collection(db,'competitions'))
  ]);
  const youth = uSnap.docs.filter(d=>d.data().role==='youth');
  const stats=[
    {icon:'👥',label:'شباب مسجلين',value:youth.length,color:'#2980B9'},
    {icon:'📅',label:'اجتماعات',value:mSnap.size,color:'#27AE60'},
    {icon:'📚',label:'واجبات',value:hSnap.size,color:'#F39C12'},
    {icon:'🏆',label:'مسابقات',value:cSnap.size,color:'#E74C3C'},
  ];
  const allTeams = {};
  const tSnap = await getDocs(collection(db,'teams'));
  tSnap.docs.forEach(d=>{allTeams[d.id]=d.data();});
  const memH = youth.map(d=>{const u=d.data();const t=allTeams[u.team_id];return`<div class="mem-c"><div class="mem-av" style="background:${t?.color||'#C9A84C'}">${u.name?.[0]||'?'}</div><div class="mem-nm">${u.name}</div><div class="mem-pt">${t?.name||'بدون فريق'}</div></div>`;}).join('') || '<div class="empty"><span>👥</span><p>لا يوجد شباب مسجلين بعد</p></div>';
  pg(`
    <div class="ph"><h1 class="pt">👑 لوحة الخدام</h1></div>
    <div class="srv-g">${stats.map(s=>`<div class="srv-c" style="--sc:${s.color}"><div class="srv-i">${s.icon}</div><div class="srv-v">${s.value}</div><div class="srv-l">${s.label}</div></div>`).join('')}</div>
    <div class="card"><div class="st">👥 كل الشباب</div><div class="mem-g">${memH}</div></div>`);
}
</script>
